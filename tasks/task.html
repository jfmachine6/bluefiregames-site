<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Task — Bluefire Games</title>
    <link href="/style.css" rel="stylesheet" type="text/css">

    <style>
        body {
            background: #050914;
        }

        .task-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #0a1226;
            border-radius: 12px;
            border: 1px solid #1a2a4a;
        }

        h1 {
            color: #4fc3ff;
            margin-bottom: 12px;
        }

        /* DEVLOG GRID */
        .devlog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .devlog-card {
            background: #0f1a33;
            border: 1px solid #1a2a4a;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.2s ease;
        }

        .devlog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 14px rgba(79, 195, 255, 0.25);
        }

        .devlog-thumb {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .devlog-info {
            padding: 12px 14px;
        }

        .devlog-info h3 {
            margin: 0 0 6px 0;
            color: #4fc3ff;
            font-size: 1.05rem;
        }

        .devlog-button {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 14px;
            background: #1a3cff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s ease;
            width: fit-content;
        }

        .devlog-button:hover {
            background: #4f6dff;
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 16px;
            background: #1a3cff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-link:hover {
            background: #4f6dff;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="task-container">
    <h1 id="task-title"></h1>

    <a id="project-link" class="back-link" style="margin-bottom:20px; display:inline-block;">
        ← Back to Project
    </a>

    <!-- ⭐ SECTION LOADER -->
    <div id="task-loading" class="section-loader">
        <div class="loader"></div>
    </div>

    <!-- ⭐ FADES IN WHEN LOADED -->
    <div id="task-content" class="fade-section"></div>

    <div class="fade-section" id="devlog-section">
        <h2 style="color:#6faaff; margin-top:30px;">Devlogs in this Task</h2>
        <div id="devlog-list-container" class="devlog-grid"></div>
    </div>
</div>

<script>
    // Load navigation
    fetch("/nav.html")
        .then(r => r.text())
        .then(html => {
            document.getElementById("nav-placeholder").innerHTML = html;
        });
</script>

<script>
    // --- Include your renderRichText + renderBlock functions here ---

    const params = new URLSearchParams(window.location.search);
    const taskId = params.get("id");

    fetch(`https://bluefire-notion.jfedders6.workers.dev/task?id=${taskId}`)
        .then(r => r.json())
        .then(task => {
            document.getElementById("task-title").textContent = task.title;

            // Link back to project
            if (task.projectId) {
                document.getElementById("project-link").href =
                    `/projects/project.html?id=${task.projectId}`;
            }

            // Render task body blocks
            const container = document.getElementById("task-content");
            (task.blocks || []).forEach(block => {
                container.appendChild(renderBlock(block));
            });

            // Render devlogs as CARDS
            const list = document.getElementById("devlog-list-container");

            task.devlogs.forEach(d => {
                const card = document.createElement("div");
                card.className = "devlog-card";

                // Thumbnail
                if (d.thumbnail) {
                    const img = document.createElement("img");
                    img.src = d.thumbnail;
                    img.alt = d.title + " thumbnail";
                    img.className = "devlog-thumb";
                    card.appendChild(img);
                }

                // Info
                const info = document.createElement("div");
                info.className = "devlog-info";

                const title = document.createElement("h3");
                title.textContent = d.title;

                const button = document.createElement("a");
                button.href = `/devlogs/devlog.html?id=${d.id}`;
                button.className = "devlog-button";
                button.textContent = "View Devlog";

                info.appendChild(title);
                info.appendChild(button);

                card.appendChild(info);
                list.appendChild(card);
            });

            // ⭐ Fade in content
            document.getElementById("task-loading").style.display = "none";
            container.classList.add("visible");
            document.getElementById("devlog-section").classList.add("visible");
        })
        .catch(err => {
            console.error("Error loading task:", err);
            document.getElementById("task-loading").style.display = "none";
        });
</script>

</body>
</html>
