<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task — BlueFire Games</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    /* Task-specific styling */

    .devlog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .devlog-card {
      background: #0a1226;
      border: 1px solid #1a2a4a;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      transition: 0.25s ease;
      text-decoration: none;
    }

    .devlog-card:hover {
      transform: scale(1.02);
      border-color: #4fc3ff;
      box-shadow: 0 0 12px rgba(79, 195, 255, 0.35);
    }

    .devlog-thumb {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #1a2a4a;
      margin-bottom: 12px;
      background: #0f1a33;
    }

    .devlog-title {
      font-size: 1.05rem;
      color: #d8e2f3;
      margin-bottom: 6px;
    }

    .devlog-date {
      font-size: 0.85rem;
      color: #9bb3d6;
    }

    .devlog-count-total {
      margin-top: 10px;
      font-size: 1rem;
      color: #7fa4d6;
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<!-- MAIN CONTENT (no hero banner) -->
<div class="content-container fade-section" id="content">

  <h1 class="content-title" id="task-title"></h1>
  <div class="content-date" id="task-desc"></div>

  <div class="devlog-count-total" id="task-devlog-count"></div>

  <div id="devlog-grid" class="devlog-grid"></div>

  <!-- Project Footer (same style as devlog page) -->
  <div class="project-return-card">
    <a id="project-link" class="project-return-link">
      <div class="project-return-layout">
        <img id="project-thumb" class="project-return-thumb" />
        <div class="project-return-text">
          <div class="project-return-title">Project</div>
          <div class="project-return-name" id="project-name"></div>
        </div>
      </div>
    </a>
  </div>

</div>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

async function loadTask() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (!id) return;

  const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

  // Fetch task
  const taskRes = await fetch(`${WORKER}/task?id=${id}`);
  const task = await taskRes.json();

  // Fetch all devlogs (fast list)
  const devlogRes = await fetch(`${WORKER}/devlogs`);
  const allDevlogs = await devlogRes.json();

  // Title + description
  document.getElementById("task-title").textContent = task.title;
  document.getElementById("task-desc").textContent = task.description;

  // Devlog count
  document.getElementById("task-devlog-count").textContent =
    `${task.devlogs.length} Dev Logs`;

  // Build devlog grid
  const grid = document.getElementById("devlog-grid");

  const sessionIds = task.devlogs.map(d => d.id.replace(/-/g, ""));
  const taskDevlogs = allDevlogs.filter(d => sessionIds.includes(d.id));

  taskDevlogs.forEach(d => {
    const card = document.createElement("a");
    card.className = "devlog-card";
    card.href = `/devlogs/devlog.html?id=${d.id}`; // FIXED PATH

    const thumb = document.createElement("img");
    thumb.className = "devlog-thumb";
    thumb.src = d.thumbnail || "/assets/default-thumb.png";

    const dTitle = document.createElement("div");
    dTitle.className = "devlog-title";
    dTitle.textContent = d.title;

    const dDate = document.createElement("div");
    dDate.className = "devlog-date";
    dDate.textContent = formatDate(d.date);

    card.appendChild(thumb);
    card.appendChild(dTitle);
    card.appendChild(dDate);

    grid.appendChild(card);
  });

  // Project footer (task.devlogs does NOT include relations)
  // So we fetch the project manually using the task's project relation
  if (task.projectId || (task.devlogs.length > 0 && task.devlogs[0].projectId)) {
    const projectId =
      task.projectId ||
      task.devlogs[0].projectId ||
      null;

    if (projectId) {
      const projectRes = await fetch(`${WORKER}/project?id=${projectId}`);
      const project = await projectRes.json();

      document.getElementById("project-link").href =
        `/projects/project.html?id=${project.id}`;

      document.getElementById("project-thumb").src =
        project.thumbnail || "/assets/default-thumb.png";

      document.getElementById("project-name").textContent = project.title;
    }
  }

  // Fade in
  setTimeout(() => {
    document.getElementById("content").classList.add("visible");
  }, 50);
}

loadTask();
</script>

</body>
</html>
