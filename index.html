<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bluefire Games</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        body {
            background: #050914; /* match project + devlog pages */
            color: #cdd7ff;
            margin: 0;
            font-family: sans-serif;
        }

        main {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
        }

        h1 {
            color: #4fc3ff;
            font-size: 2.6rem;
            margin-bottom: 12px;
        }

        .bfgName {
            color: #6faaff;
            text-decoration: none;
            font-weight: 700;
        }

        p {
            color: #cdd7ff;
            font-size: 1.2rem;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div id="nav-placeholder"></div>

    <main>
        <h1>
            Welcome to <a class="bfgName">BlueFire Games</a>
        </h1>
        <p>Your hub for game development, prototypes, and creative experiments.</p>
    </main>

    <script>
        fetch("/nav.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("nav-placeholder").innerHTML = data;
            });
    </script>

</body>
</html>
