<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bluefire Games</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        body {
            background: #050914; /* match project + devlog pages */
            color: #cdd7ff;
            margin: 0;
            font-family: sans-serif;
        }

        main {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
        }

        h1 {
            color: #4fc3ff;
            font-size: 2.6rem;
            margin-bottom: 12px;
        }

        .bfgName {
            color: #6faaff;
            text-decoration: none;
            font-weight: 700;
        }

        p {
            color: #cdd7ff;
            font-size: 1.2rem;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div id="nav-placeholder"></div>

    <main>
        <h1>
            Welcome to <a class="bfgName">BlueFire Games</a>
        </h1>
        <p>Your hub for game development, prototypes, and creative experiments.</p>
    </main>

	<script>
	// Load navigation bar
	fetch("/nav.html")
		.then(r => r.text())
		.then(html => {
			document.getElementById("nav-placeholder").innerHTML = html;

			// Wait for nav to actually exist in DOM
			const nav = document.querySelector('.navbar');
			if (!nav) return;

			let lastScroll = 0;

			window.addEventListener('scroll', () => {
				const current = window.scrollY;

				if (current > lastScroll && current > 50) {
					nav.classList.add('hidden');   // fade out
				} else {
					nav.classList.remove('hidden'); // fade in
				}

				lastScroll = current;
			});
		});
	</script>




</body>
</html>
