<!DOCTYPE html>
<!-- Version: v0.2.4.6.0 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueFire Games | Portfolio</title>

  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/components/cards/card.css" />

  <style>
    html, body {
      overflow-x: hidden;
    }

    body {
      --palette-blue: #0b48c7;
      --palette-blue-light: #4fc3ff;
      --palette-crimson: #c4163a;
      --palette-crimson-deep: #750d2b;
      --palette-white: #f5fbff;
      background: #050914;
      color: #d8e2f3;
    }

    .page-container {
      width: min(85vw, 1600px);
      max-width: none;
      margin: 0 auto;
      padding: 20px 20px 60px 20px;
      box-sizing: border-box;
    }

    .page-container.layout-b {
      width: min(92vw, 1550px) !important;
      max-width: none !important;
      margin-left: auto !important;
      margin-right: auto !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    .page-container.layout-b .portfolio-hero {
      width: min(78vw, 1250px);
      margin-left: auto;
      margin-right: auto;
      box-sizing: border-box;
    }

    /* DEMO REEL */
    .demo-reel-wrapper {
      width: min(1100px, 100%);
      margin: 24px auto 38px;
      padding: 0 18px 18px;
      background: linear-gradient(125deg, rgba(11, 72, 199, 0.16), rgba(10, 18, 38, 0.96) 46%, rgba(117, 13, 43, 0.18));
      border: 1px solid rgba(79, 195, 255, 0.34);
      border-radius: 10px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.34), 0 0 26px rgba(11, 72, 199, 0.12);
      box-sizing: border-box;
    }

    .demo-reel-label {
      display: block;
      margin: 0 -18px 18px;
      padding: 13px 18px;
      background: linear-gradient(100deg, #0b48c7 0%, #4fc3ff 24%, #f5fbff 50%, #c4163a 78%, #750d2b 100%);
      color: #06101d;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.055rem;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.28);
      border-bottom: 1px solid rgba(255, 255, 255, 0.26);
    }

    .demo-reel-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background: #050914;
      border: 1px solid rgba(79, 195, 255, 0.45);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }

    .demo-reel-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .demo-reel-action {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    .demo-reel-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 18px;
      background: linear-gradient(100deg, #0b48c7, #227fe9 48%, #c4163a);
      border: 1px solid rgba(215, 237, 255, 0.48);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(11, 72, 199, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .demo-reel-link::before {
      content: "\25B6";
      font-size: 0.75rem;
    }

    .demo-reel-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 24px rgba(196, 22, 58, 0.32);
    }

    .demo-reel-link:focus-visible {
      outline: 3px solid #f3c969;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .demo-reel-link {
        transition: none;
      }
    }

    /* HERO / PITCH */
    .portfolio-hero {
      padding: 48px 36px;
      margin: 30px 0 40px 0;
      background: linear-gradient(112deg, rgba(11, 72, 199, 0.12), transparent 48%, rgba(196, 22, 58, 0.12)), #0a1226;
      border: 1px solid rgba(79, 195, 255, 0.3);
      border-radius: 10px;
      animation: heroIntro 1.2s ease both;
    }

    .portfolio-title {
      clip-path: inset(0 100% 0 0);
      animation: titleType 1.2s steps(38, end) 0.35s forwards;
    }

    .portfolio-name {
      clip-path: inset(0 100% 0 0);
    }

    .portfolio-eyebrow {
      clip-path: inset(0 100% 0 0);
      animation: titleType 0.75s steps(34, end) 0.225s forwards;
    }

    .portfolio-pitch {
      margin-bottom: 0;
    }

    .portfolio-pitch .pitch-char {
      opacity: 0;
      transition: opacity 0.02s linear;
    }

    .portfolio-pitch .pitch-char.typed {
      opacity: 1;
    }

    .page-container.intro-pending .section-heading,
    .page-container.intro-pending .section-subheading,
    .page-container.intro-pending #featured-container,
    .page-container.intro-pending .role-switcher {
      opacity: 0;
      pointer-events: none;
    }

    .page-container.intro-complete .section-heading,
    .page-container.intro-complete .section-subheading,
    .page-container.intro-complete #featured-container,
    .page-container.intro-complete .role-switcher {
      animation: projectsIntro 1s ease both;
    }

    @keyframes heroIntro {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes titleType {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes projectsIntro {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes titleFlameShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .portfolio-hero,
      .portfolio-name,
      .portfolio-eyebrow,
      .portfolio-title,
      .portfolio-pitch,
      .portfolio-pitch .pitch-char,
      .page-container.intro-complete .section-heading,
      .page-container.intro-complete .section-subheading,
      .page-container.intro-complete #featured-container,
      .page-container.intro-complete .role-switcher {
        animation: none;
        clip-path: none;
        opacity: 1;
        transform: none;
      }

      .portfolio-pitch .pitch-char {
        opacity: 1;
      }
    }

    /* Original static name style, kept as a backup:
    .portfolio-name {
      color: #d8e2f3;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    */
    .portfolio-name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
      margin-bottom: 10px;
      background-image: linear-gradient(90deg, #81112c 0%, #cb2746 28%, #fff2f4 50%, #ffffff 58%, #db3150 80%, #761027 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(196, 22, 58, 0.36);
      animation: titleType 0.7s steps(28, end) 0.1s forwards, titleFlameShimmer 3.5s linear infinite;
    }

    .portfolio-eyebrow {
      color: #f0788d;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: -6px;
      margin-bottom: 10px;
    }

    /* Original static title style, kept as a backup:
    .portfolio-title {
      background-image: linear-gradient(100deg, #0b48c7, #4fc3ff 30%, #ffffff 55%, #c4163a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      font-size: 2.3rem;
      margin: 0 0 14px 0;
    }
    */
    .portfolio-title {
      color: #4fc3ff;
      font-size: 2.7rem;
      margin: 0 0 14px 0;
    }

    .portfolio-pitch {
      color: #b9c9ea;
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 760px;
    }

    .portfolio-proof {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 26px;
    }

    .proof-item {
      padding: 14px;
      background: linear-gradient(120deg, rgba(11, 72, 199, 0.12), rgba(12, 20, 34, 0.9));
      border-left: 3px solid #4fc3ff;
      color: #b9c9ea;
      font-size: 0.9rem;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(18px);
      animation: proofReveal 0.65s ease forwards;
    }

    .proof-item:nth-child(1) { animation-delay: 0.15s; }
    .proof-item:nth-child(2) { animation-delay: 0.35s; border-left-color: #c4163a; }
    .proof-item:nth-child(3) { animation-delay: 0.55s; }
    .proof-item:nth-child(4) { animation-delay: 0.75s; border-left-color: #c4163a; }

    @keyframes proofReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .proof-item {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    .proof-item strong {
      display: block;
      color: #d8e2f3;
      margin-bottom: 4px;
    }

    .proof-item.award {
      border-left-color: #c4163a;
    }

    .skill-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .skill-pill {
      padding: 10px 20px;
      background: #142640;
      border: 1px solid #5278a4;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03rem;
      color: #f1f7ff;
    }

    .skill-pill.match {
      background: #244b78;
      color: #ffffff;
      border-color: #a8d7ff;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(79, 149, 255, 0.28);
    }

    /* SECTIONS */
    .section-heading {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 0.03rem;
      margin: 54px 0 6px 0;
      background-image: linear-gradient(100deg, #0b48c7, #4fc3ff 42%, #ffffff 68%, #c4163a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .section-heading::before {
      content: "\2699";
      font-size: 1.6rem;
      -webkit-text-fill-color: #4fc3ff;
      color: #4fc3ff;
    }

    .section-subheading {
      color: #7fa4d6;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* FEATURED PROJECT BLOCK */
    .featured-project {
      position: relative;
      background: #0a1226;
      border: 1px solid #1a2a4a;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .featured-thumb {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background: #0f1a33;
      display: block;
    }

    .featured-project > .image-loader {
      width: 100%;
      height: 260px;
    }

    .featured-body {
      padding: 22px 26px;
    }

    .featured-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
    }

    .featured-title {
      font-size: 1.4rem;
      color: #d6edff;
      margin: 0;
    }

    .featured-match {
      font-size: 0.8rem;
      color: #6faaff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .project-tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      box-sizing: border-box;
      margin: 0 0 10px 0;
      padding: 8px 16px;
      background: linear-gradient(105deg, #0b48c7, #d8efff 48%, #c4163a);
      color: #07111e;
      font-size: 0.8rem;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.04rem;
      text-transform: uppercase;
      text-align: center;
      border-radius: 4px;
      border: 1px solid rgba(215, 237, 255, 0.7);
      box-shadow: 0 4px 14px rgba(11, 72, 199, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .snake-media-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 420px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .snake-project .project-tagline {
      font-size: 0.9rem;
      padding: 10px 18px;
      margin: 0;
    }

    .featured-desc {
      color: #b9c9ea;
      margin: 10px 0 16px 0;
      line-height: 1.5;
    }

    .featured-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag-pill {
      padding: 3px 10px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #9bb3d6;
    }

    .tag-pill.match {
      color: #4fc3ff;
      border-color: #4fc3ff;
    }

    .featured-devlogs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .view-project-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 14px;
      border: 1px solid rgba(79, 195, 255, 0.58);
      border-radius: 8px;
      background: linear-gradient(100deg, rgba(11, 72, 199, 0.28), rgba(196, 22, 58, 0.14));
      color: #e4f4ff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .view-project-link:hover {
      transform: translateX(4px);
      background: linear-gradient(100deg, rgba(79, 195, 255, 0.3), rgba(79, 195, 255, 0.08));
      border-color: #4fc3ff;
    }

    .loader {
      margin: 40px auto;
    }

    .role-switcher {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #6b7fa8;
    }

    .role-switcher a {
      color: #6faaff;
    }

    .project-snake-layout {
      display: flex;
      flex-direction: column;
      gap: 58px;
      margin-top: 20px;
      width: 100%;
    }

    .snake-project {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
      box-sizing: border-box;
      padding-bottom: 18px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(106, 137, 190, 0.2);
    }

    .snake-header {
      padding: 0 4px;
    }

    .snake-header h3 {
      color: #4fc3ff;
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 2rem);
    }

    .snake-kicker {
      color: #6faaff;
      text-transform: uppercase;
      letter-spacing: 0.12rem;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .snake-row {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 18px;
      align-items: stretch;
      min-height: 420px;
      width: 100%;
    }

    .snake-project.left .snake-row {
      grid-template-columns: 3fr 2fr;
    }

    .snake-project.right .snake-row {
      grid-template-columns: 2fr 3fr;
    }

    .snake-media-column,
    .snake-copy {
      opacity: 0;
      transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .snake-project.left .snake-media-column {
      order: 1;
      transform: translateX(-120vw);
    }

    .snake-project.left .snake-copy {
      order: 2;
      transform: translateX(120vw);
    }

    .snake-project.right .snake-media-column {
      order: 2;
      transform: translateX(120vw);
    }

    .snake-project.right .snake-copy {
      order: 1;
      transform: translateX(-120vw);
    }

    .snake-project.visible .snake-media-column,
    .snake-project.visible .snake-copy {
      opacity: 1;
      transform: translateX(0);
    }

    .snake-media {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 28px rgba(0, 0, 0, 0.18);
      box-sizing: border-box;
    }

    .snake-media img {
      width: 100%;
      height: 100%;
      min-height: 240px;
      object-fit: cover;
      display: block;
    }

    .snake-media > .image-loader {
      width: 100%;
      height: 100%;
      min-height: 240px;
    }

    .snake-copy {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 28px 22px 24px 22px;
      min-height: 420px;
      box-sizing: border-box;
      background: rgba(10, 18, 38, 0.7);
      border: 1px solid #1a2a4a;
      border-radius: 18px;
      width: 100%;
    }

    .snake-copy p {
      color: #b9c9ea;
      margin: 0 0 14px 0;
      line-height: 1.6;
    }

    .snake-copy h3 {
      margin: 0 0 18px 0;
      padding-left: 14px;
      border-left: 4px solid #4fc3ff;
      color: #f0f7ff;
      font-size: clamp(1.7rem, 2.5vw, 2.45rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-shadow: 0 0 18px rgba(79, 195, 255, 0.25);
    }

    .snake-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .snake-tags .tag-pill {
      margin: 0;
    }

    .snake-devlogs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 8px;
      align-items: stretch;
    }

    .snake-devlogs .devlog-card {
      min-height: 0;
      height: auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .snake-devlogs .image-loader {
      width: 100%;
      height: 140px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #1a2a4a;
    }

    .snake-copy > .view-project-link {
      display: block;
      align-self: flex-start;
      width: 100%;
      box-sizing: border-box;
      flex-shrink: 0;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(106, 137, 190, 0.28);
    }

    @media (max-width: 980px) {
      .page-container {
        width: min(100%, 1600px);
        padding: 18px 24px 52px;
      }

      .page-container.layout-b {
        width: 100% !important;
        padding: 0 24px !important;
      }

      .page-container.layout-b .portfolio-hero {
        width: 100%;
      }

      .portfolio-hero {
        padding: 28px 20px;
      }

      .portfolio-proof {
        grid-template-columns: 1fr;
      }

      .snake-row {
        grid-template-columns: 1fr !important;
        min-height: 0;
      }

      .snake-project.left .snake-media-column,
      .snake-project.right .snake-media-column,
      .snake-project.left .snake-copy,
      .snake-project.right .snake-copy {
        order: initial;
        transform: translateY(30px);
      }

      .snake-project.visible .snake-media-column,
      .snake-project.visible .snake-copy {
        transform: translateY(0);
      }

      .snake-media-column {
        min-height: 0;
      }

      .snake-media,
      .snake-media img,
      .snake-media > .image-loader,
      .snake-copy {
        min-height: 240px;
      }
    }

    @media (max-width: 680px) {
      .page-container,
      .page-container.layout-b {
        padding: 14px !important;
      }

      .portfolio-hero {
        padding: 24px 18px;
        margin: 20px 0 28px;
      }

      .portfolio-name {
        font-size: 1.1rem;
        letter-spacing: 0.08rem;
      }

      .portfolio-title {
        font-size: 2rem;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      .portfolio-eyebrow {
        font-size: 0.72rem;
        line-height: 1.4;
      }

      .portfolio-proof {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 18px;
      }

      .proof-item {
        padding: 12px;
      }

      .skill-pill {
        padding: 8px 12px;
        font-size: 0.9rem;
      }

      .demo-reel-label {
        font-size: 1.2rem;
        margin-left: -12px;
        margin-right: -12px;
      }

      .demo-reel-wrapper {
        padding: 0 12px 14px;
        margin: 18px auto 28px;
      }

      .section-heading {
        font-size: 1.6rem;
        margin-top: 36px;
      }

      .featured-body {
        padding: 18px 16px;
      }

      .snake-row {
        gap: 14px;
      }

      .snake-copy {
        padding: 20px 16px;
      }

      .snake-devlogs {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 360px) {
      .portfolio-proof {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="page-container intro-pending">

  <div class="portfolio-hero">
    <div class="portfolio-name">Joey Fedders</div>
    <h1 class="portfolio-title" id="role-title">Loading...</h1>
    <div class="portfolio-eyebrow" id="role-eyebrow">Tailored Portfolio</div>
    <p class="portfolio-pitch" id="role-pitch"></p>
    <div class="portfolio-proof" id="portfolio-proof"></div>
    <div class="skill-pill-row" id="skill-pill-row"></div>
  </div>

  <div class="demo-reel-wrapper" id="demo-reel-wrapper" style="display:none;">
    <div class="demo-reel-label">Featured Demo Reel</div>
    <div class="demo-reel-frame" id="demo-reel-frame"></div>
    <div class="demo-reel-action">
      <a class="demo-reel-link" id="demo-reel-link" href="https://www.youtube.com/watch?v=YMWdm88zfhg" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>
    </div>
  </div>

  <h2 class="section-heading">Under the Hood</h2>
  <p class="section-subheading">
    Curated catalog of work from my live project &amp; development log database.
  </p>

  <div id="featured-container"></div>

  <div id="loader" class="section-loader">
    <div class="loader"></div>
  </div>

  <div class="role-switcher" id="role-switcher"></div>

</div>

<script>
history.scrollRestoration = "manual";
window.scrollTo(0, 0);

// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

// ------------------------------------------------------------------
// ROLE PROFILES
// Add a new entry here per job application, then link to
// /portfolio/?role=<key> as the "portfolio" link on that application.
// ------------------------------------------------------------------
const ROLE_PROFILES = {
  "epic-rl-techart": {
    label: "Designed for Epic Games Tech Art Intern Role",
    title: "Technical Artist Portfolio",
    pitch: "A curated slice of my work that best reflects the tech art discipline: " +
      "building artist-facing workflows, authoring materials and VFX, integrating assets, " +
      "and making gameplay systems readable inside Unreal Engine.",
    demoReel: "https://www.youtube.com/watch?v=YMWdm88zfhg",
    heroTags: [
      { label: "UE", matchKeys: ["UE"] },
      { label: "Programming", matchKeys: ["Programming"] },
      { label: "Modeling", matchKeys: ["Modeling"] },
      { label: "Materials", matchKeys: ["Materials", "Material", "Substance Painter"] },
      { label: "Pipelines", matchKeys: ["Pipelines", "Pipeline", "Pipeline Building"] }
    ],
    proof: [
      ["Artist-facing workflows", "Procedural Unreal tools that replace repetitive authoring steps."],
      ["Real-time visuals", "Materials, VFX, animation, and asset integration."],
      ["Feedback-driven iteration", "Playtest feedback turned into clearer gameplay cues."],
      ["Technical leadership", "Dual CS + DFX; game-jam leadership and Rocket League experience."]
    ],
    keywords: {
      "UE": 5, "Programming": 4, "Particle Systems": 4, "Substance Painter": 3,
      "Blender": 3, "Rigging": 2, "Animation": 2, "Motion Capture": 2,
      "Research": 2, "Modeling": 2, "ZBrush": 2, "School": 1,
      "Shape Keys": 1, "Concept": 1, "Art": 1
    },
    titleBonus: ["rig", "shader", "particle", "pipeline", "tool", "physics", "vfx", "shape key", "material", "noise", "unreal", "texture", "uv", "motion capture", "input"]
  },
  "general": {
    label: "General Software / Game Dev",
    title: "Software & Game Development Portfolio",
    pitch: "A curated overview of programming, tools, and production work across BlueFire's projects.",
    keywords: {
      "Programming": 3, "Pipeline Building": 2, "UE": 2, "Research": 1,
      "Web Design": 1, "Career": 1, "Team Management": 1
    },
    titleBonus: ["system", "pipeline", "tool", "programming"]
  }
};

const params = new URLSearchParams(window.location.search);
const roleKey = ROLE_PROFILES[params.get("role")] ? params.get("role") : "epic-rl-techart";
const profile = ROLE_PROFILES[roleKey];
const pageContainer = document.querySelector(".page-container");
pageContainer.classList.add("layout-b");

document.getElementById("role-eyebrow").textContent = profile.label;
document.getElementById("role-title").textContent = profile.title;

function getYouTubeEmbedUrl(url) {
  const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  return match ? `https://www.youtube.com/embed/${match[1]}` : null;
}

const PROJECT_TAGLINES = {
  "vert": "Cross-Discipline Innovation with Passion",
  "wizard gunslinger": "Asset Pipeline Excellence",
  "icarus vector": "Visual Systems Engineering",
  "norse game jam": "Strong Teamwork Initiative & Leadership",
  "motion capture animation pipeline": "Advanced Pipeline R & D",
  "motion capture pipeline": "Advanced Pipeline R & D",
  "miscellaneous": "Lifelong Passion for Growth and Learning",
  "skill development & enrichment": "Lifelong Passion for Growth and Learning"
};

function getProjectTagline(title) {
  return PROJECT_TAGLINES[(title || "").trim().toLowerCase()] || null;
}

if (profile.demoReel) {
  const embedUrl = getYouTubeEmbedUrl(profile.demoReel);
  if (embedUrl) {
    const iframe = document.createElement("iframe");
    iframe.src = embedUrl;
    iframe.title = "Demo Reel";
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;
    document.getElementById("demo-reel-link").href = profile.demoReel;
    document.getElementById("demo-reel-frame").appendChild(iframe);
    document.getElementById("demo-reel-wrapper").style.display = "block";
  }
}

function setupPitchTyping(element, text) {
  element.replaceChildren();
  const characters = [];
  Array.from(text).forEach(character => {
    if (character === " ") {
      element.appendChild(document.createTextNode(" "));
      return;
    }

    const span = document.createElement("span");
    span.className = "pitch-char";
    span.textContent = character;
    element.appendChild(span);
    characters.push(span);
  });

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let charDelay = 1250;
  characters.forEach((character, index) => {
    if (!reducedMotion && index > 0) {
      const previousCharacter = text[index - 1];
      const isWordBoundary = previousCharacter === " ";
      const hasPause = isWordBoundary && Math.random() < 0.35;
      const minimumDelay = hasPause ? 18 : 3;
      const maximumDelay = hasPause ? 30 : 13;
      charDelay += minimumDelay + Math.floor(Math.random() * (maximumDelay - minimumDelay + 1));
    }
    window.setTimeout(() => character.classList.add("typed"), reducedMotion ? 0 : charDelay);
  });
}

setupPitchTyping(document.getElementById("role-pitch"), profile.pitch);

const proofRow = document.getElementById("portfolio-proof");
(profile.proof || []).forEach(([heading, text]) => {
  const item = document.createElement("div");
  item.className = "proof-item" + (heading === "Technical leadership" ? " award" : "");
  item.innerHTML = `<strong>${heading}</strong>${text}`;
  proofRow.appendChild(item);
});

document.getElementById("role-switcher").innerHTML =
  "Viewing profile: <strong>" + profile.label + "</strong> &middot; " +
  Object.keys(ROLE_PROFILES)
    .filter(k => k !== roleKey)
    .map(k => `<a href="/portfolio/?role=${k}">${ROLE_PROFILES[k].label}</a>`)
    .join(" &middot; ");

function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function scoreTags(tags = []) {
  return tags.reduce((sum, t) => sum + (profile.keywords[t] || 0), 0);
}

function titleBonus(title = "") {
  const lower = title.toLowerCase();
  return profile.titleBonus.reduce((sum, kw) => sum + (lower.includes(kw) ? 2 : 0), 0);
}

function renderOptionA(rankedProjects, scoredDevlogs) {
  const container = document.getElementById("featured-container");
  container.className = "";
  container.innerHTML = "";

  rankedProjects.forEach(project => {
    const block = document.createElement("div");
    block.className = "featured-project";

    const tagline = getProjectTagline(project.title);
    if (tagline) {
      const taglineEl = document.createElement("div");
      taglineEl.className = "project-tagline";
      taglineEl.textContent = tagline;
      block.appendChild(taglineEl);
    }

    const thumb = createProjectThumbnail(
      project.thumbnail,
      project.title,
      "featured-thumb",
      { width: 1200, height: 260, loading: "eager", fetchPriority: "low" }
    );
    block.appendChild(thumb);

    const body = document.createElement("div");
    body.className = "featured-body";

    const titleRow = document.createElement("div");
    titleRow.className = "featured-title-row";

    const title = document.createElement("h3");
    title.className = "featured-title";
    title.textContent = project.title;

    const match = document.createElement("div");
    match.className = "featured-match";
    match.textContent = `RELEVANCE ${project.relevance}`;

    titleRow.appendChild(title);
    titleRow.appendChild(match);
    body.appendChild(titleRow);

    const desc = document.createElement("p");
    desc.className = "featured-desc";
    desc.textContent = project.description || "";
    body.appendChild(desc);

    const projectDevlogs = scoredDevlogs
      .filter(d => d.projectId === project.id && d.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 3);

    const tagSet = new Set();
    projectDevlogs.forEach(d => (d.tags || []).forEach(t => tagSet.add(t)));

    const tagsRow = document.createElement("div");
    tagsRow.className = "featured-tags";
    tagSet.forEach(tag => {
      const pill = document.createElement("span");
      pill.className = "tag-pill" + (profile.keywords[tag] ? " match" : "");
      pill.textContent = tag;
      tagsRow.appendChild(pill);
    });
    body.appendChild(tagsRow);

    const devlogGrid = document.createElement("div");
    devlogGrid.className = "featured-devlogs";

    projectDevlogs.forEach(d => {
      const card = document.createElement("a");
      card.className = "devlog-card";
      card.href = `/devlogs/devlog.html?id=${d.id}`;

      const dThumb = createThumbnailMedia(
        d.thumbnail,
        d.title,
        "devlog-thumb",
        { width: 340, height: 140, loading: "eager", fetchPriority: "low" }
      );

      const dTitle = document.createElement("div");
      dTitle.className = "devlog-title";
      dTitle.textContent = d.title;

      const dDate = document.createElement("div");
      dDate.className = "devlog-date";
      dDate.textContent = formatDate(d.date);

      card.appendChild(dThumb);
      card.appendChild(dTitle);
      card.appendChild(dDate);
      devlogGrid.appendChild(card);
    });

    body.appendChild(devlogGrid);

    const link = document.createElement("a");
    link.className = "view-project-link";
    link.href = `/projects/project.html?id=${project.id}`;
    link.textContent = "View Full Project →";
    body.appendChild(link);

    block.appendChild(body);
    container.appendChild(block);
  });
}

function renderOptionB(rankedProjects, scoredDevlogs) {
  const container = document.getElementById("featured-container");
  container.className = "project-snake-layout";
  container.innerHTML = "";

  rankedProjects.forEach((project, index) => {
    const projectDevlogs = scoredDevlogs
      .filter(d => d.projectId === project.id && d.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 3);

    const block = document.createElement("article");
    block.className = "snake-project " + (index % 2 === 0 ? "left" : "right");

    const kicker = document.createElement("div");
    kicker.className = "snake-kicker";
    kicker.textContent = `Project ${index + 1} · ${project.relevance} relevance`;

    const title = document.createElement("h3");
    title.textContent = project.title;

    const row = document.createElement("div");
    row.className = "snake-row";

    const media = document.createElement("div");
    media.className = "snake-media";
    media.appendChild(createProjectThumbnail(
      project.thumbnail,
      project.title,
      "",
      { width: 1200, height: 800, loading: "eager", fetchPriority: "low" }
    ));

    const mediaColumn = document.createElement("div");
    mediaColumn.className = "snake-media-column";

    const tagline = getProjectTagline(project.title);
    if (tagline) {
      const taglineEl = document.createElement("div");
      taglineEl.className = "project-tagline";
      taglineEl.textContent = tagline;
      mediaColumn.appendChild(taglineEl);
    }

    mediaColumn.appendChild(media);

    const copy = document.createElement("div");
    copy.className = "snake-copy";

    const desc = document.createElement("p");
    desc.textContent = project.description || "";

    const tagSet = new Set();
    projectDevlogs.forEach(d => (d.tags || []).forEach(t => tagSet.add(t)));

    const tagsRow = document.createElement("div");
    tagsRow.className = "snake-tags";
    Array.from(tagSet).forEach(tag => {
      const pill = document.createElement("span");
      pill.className = "tag-pill" + (profile.keywords[tag] ? " match" : "");
      pill.textContent = tag;
      tagsRow.appendChild(pill);
    });

    const devlogGrid = document.createElement("div");
    devlogGrid.className = "snake-devlogs";
    projectDevlogs.forEach(d => {
      const card = document.createElement("a");
      card.className = "devlog-card";
      card.href = `/devlogs/devlog.html?id=${d.id}`;

      const thumb = createThumbnailMedia(
        d.thumbnail,
        d.title,
        "devlog-thumb",
        { width: 340, height: 140, loading: "eager", fetchPriority: "low" }
      );

      const name = document.createElement("div");
      name.className = "devlog-title";
      name.textContent = d.title;

      const date = document.createElement("div");
      date.className = "devlog-date";
      date.textContent = formatDate(d.date);

      card.appendChild(thumb);
      card.appendChild(name);
      card.appendChild(date);
      devlogGrid.appendChild(card);
    });

    const link = document.createElement("a");
    link.className = "view-project-link";
    link.href = `/projects/project.html?id=${project.id}`;
    link.textContent = "View Full Project →";

    copy.appendChild(desc);
    copy.insertBefore(title, copy.firstChild);
    copy.insertBefore(kicker, title);

    copy.appendChild(tagsRow);
    copy.appendChild(devlogGrid);
    copy.appendChild(link);

    if (index % 2 === 0) {
      row.appendChild(mediaColumn);
      row.appendChild(copy);
    } else {
      row.appendChild(copy);
      row.appendChild(mediaColumn);
    }

    block.appendChild(row);
    container.appendChild(block);
  });

  const projectBlocks = document.querySelectorAll(".snake-project");
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add("visible");
      observer.unobserve(entry.target);
    });
  }, { threshold: 0.18 });

  const observeProjects = () => projectBlocks.forEach(block => observer.observe(block));
  if (pageContainer.classList.contains("intro-pending")) {
    pageContainer.addEventListener("portfolio:intro-complete", observeProjects, { once: true });
  } else {
    observeProjects();
  }
}

async function loadPortfolio() {
  const [projectsRes, devlogsRes] = await Promise.all([
    fetch(`${WORKER}/projects`, { mode: "cors", cache: "no-store" }),
    fetch(`${WORKER}/devlogs`, { mode: "cors", cache: "no-store" })
  ]);

  const projects = await projectsRes.json();
  const devlogs = await devlogsRes.json();

  document.getElementById("loader").style.display = "none";

  const scoredDevlogs = devlogs.map(d => ({
    ...d,
    score: scoreTags(d.tags) + titleBonus(d.title)
  }));

  const projectScores = {};
  scoredDevlogs.forEach(d => {
    if (!d.projectId) return;
    projectScores[d.projectId] = (projectScores[d.projectId] || 0) + d.score;
  });

  const rankedProjects = projects
    .map(p => ({ ...p, relevance: projectScores[p.id] || 0 }))
    .filter(p => p.relevance > 0)
    .sort((a, b) => b.relevance - a.relevance)
    .slice(0, 6);

  const vertIndex = rankedProjects.findIndex(
    project => project.title && project.title.trim().toLowerCase() === "vert"
  );
  if (vertIndex > 0) {
    rankedProjects.unshift(rankedProjects.splice(vertIndex, 1)[0]);
  }

  const miscIndex = rankedProjects.findIndex(project => {
    const title = (project.title || "").trim().toLowerCase();
    return title === "miscellaneous" || title === "skill development & enrichment";
  });
  if (miscIndex > -1 && miscIndex < rankedProjects.length - 1) {
    rankedProjects.push(rankedProjects.splice(miscIndex, 1)[0]);
  }

  const matchedTags = new Set();
  scoredDevlogs
    .filter(d => rankedProjects.some(p => p.id === d.projectId))
    .forEach(d => (d.tags || []).forEach(t => matchedTags.add(t)));

  const pillRow = document.getElementById("skill-pill-row");
  pillRow.innerHTML = "";

  if (profile.heroTags) {
    profile.heroTags.forEach(({ label }) => {
      const pill = document.createElement("div");
      pill.className = "skill-pill match";
      pill.textContent = label;
      pillRow.appendChild(pill);
    });
  } else {
    Object.keys(profile.keywords)
      .sort((a, b) => profile.keywords[b] - profile.keywords[a])
      .forEach(tag => {
        const pill = document.createElement("div");
        pill.className = "skill-pill" + (matchedTags.has(tag) ? " match" : "");
        pill.textContent = tag;
        pillRow.appendChild(pill);
      });
  }

  const container = document.getElementById("featured-container");

  if (rankedProjects.length === 0) {
    container.innerHTML = "<p style='color:#7fa4d6;'>No matching projects found for this role yet.</p>";
    return;
  }

  renderOptionB(rankedProjects, scoredDevlogs);
}

</script>

<script src="/components/loader.js"></script>
<script>
  loadPortfolio();

  const introDuration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1500;
  window.setTimeout(() => {
    pageContainer.classList.remove("intro-pending");
    pageContainer.classList.add("intro-complete");
    pageContainer.dispatchEvent(new Event("portfolio:intro-complete"));
  }, introDuration);
</script>
