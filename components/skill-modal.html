<!-- Version: v0.2.4.3.0 -->
<!-- SKILL MODAL COMPONENT -->
<div id="skill-modal-overlay" class="skill-modal-overlay hidden">
  <div id="skill-modal" class="skill-modal">
    <button id="skill-modal-close" class="skill-modal-close">✕</button>

    <h2 id="skill-modal-name" class="skill-modal-name"></h2>

    <div id="skill-modal-meta" class="skill-modal-meta"></div>

    <p id="skill-modal-description" class="skill-modal-description"></p>

    <div id="skill-modal-themes" class="skill-modal-themes"></div>

    <!-- This is where examples, project cards, devlog cards, and task cards will render -->
    <div id="skill-modal-links" class="skill-modal-links"></div>
  </div>
</div>

<!-- CARD COMPONENT STYLES -->
<link rel="stylesheet" href="/components/cards/card.css" />

<style>
  .skill-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .skill-modal-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .skill-modal {
    background: #0a1226;
    border: 1px solid #1a2a4a;
    border-radius: 14px;
    padding: 28px;
    width: min(600px, 90%);
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 0 20px rgba(79, 195, 255, 0.35);
    position: relative;
  }

  .skill-modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #0f1a33;
    border: 1px solid #1a2a4a;
    color: #9bb3d6;
    font-size: 1.2rem;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .skill-modal-close:hover {
    background: #4fc3ff;
    color: #000;
  }

  .skill-modal-name {
    color: #4fc3ff;
    font-size: 1.7rem;
    margin-bottom: 10px;
  }

  .skill-modal-meta {
    color: #9bb3d6;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }

  .skill-modal-description {
    color: #d8e2f3;
    line-height: 1.55;
    margin-bottom: 20px;
  }

  .skill-modal-themes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .skill-modal-theme-pill {
    padding: 4px 12px;
    background: #0f1a33;
    border: 1px solid #1a2a4a;
    border-radius: 12px;
    font-size: 0.8rem;
    color: #9bb3d6;
  }

  .skill-modal-links {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px; /* spacing between cards and sections */
  }

  .skill-modal-section-header {
    margin-top: 22px;
    margin-bottom: 8px;
    font-size: 1rem;
    color: #4fc3ff;
    font-weight: 600;
    border-bottom: 1px solid #1a2a4a;
    padding-bottom: 4px;
  }

  .skill-modal-examples-list {
    margin: 0 0 16px 0;
    padding-left: 20px;
    color: #d8e2f3;
    line-height: 1.55;
  }

  .skill-modal-examples-list li {
    margin-bottom: 6px;
  }

  /* Grid used for devlogs inside the modal */
  .skill-modal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    align-items: start;
  }

  .skill-modal-project-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .skill-modal-parent-tree {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 0 4px 0;
  }

  .skill-modal-parent-tree-label {
    color: #9bb3d6;
    font-size: 0.9rem;
    text-align: center;
  }

  .skill-modal-parent-row {
    position: relative;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    padding: 8px 0;
  }

  .skill-modal-parent-row::after {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    height: 1px;
    background: rgba(79, 195, 255, 0.12);
    bottom: 0;
    z-index: 0;
  }

  .skill-modal-parent-row:last-child::after {
    display: none;
  }

  .skill-modal-parent-node {
    position: relative;
    z-index: 1;
    padding: 8px 14px;
    border: 1px solid #1a2a4a;
    border-radius: 999px;
    background: #0f1a33;
    color: #d8e2f3;
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    font-size: 0.9rem;
    min-width: 96px;
    text-align: center;
  }

  .skill-modal-parent-node::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 16px;
    background: rgba(79, 195, 255, 0.18);
    top: 100%;
  }

  .skill-modal-parent-row:last-child .skill-modal-parent-node::after {
    display: none;
  }

  .skill-modal-parent-node:hover {
    transform: translateY(-2px);
    border-color: #4fc3ff;
    background: rgba(79, 195, 255, 0.12);
  }

  .skill-modal-parent-none {
    color: #9bb3d6;
    font-size: 0.95rem;
    text-align: center;
    padding: 10px 0;
  }

  /* Scrollbar styling */
  .skill-modal::-webkit-scrollbar {
    width: 10px;
  }

  .skill-modal::-webkit-scrollbar-track {
    background: #0a1226;
    border-radius: 10px;
  }

  .skill-modal::-webkit-scrollbar-thumb {
    background: #1a2a4a;
    border-radius: 10px;
    border: 2px solid #0a1226;
  }

  .skill-modal::-webkit-scrollbar-thumb:hover {
    background: #4fc3ff;
  }


</style>
