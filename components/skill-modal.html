<!-- Version: v0.2.4.5.3 -->
<!-- SKILL MODAL COMPONENT -->
<div id="skill-modal-overlay" class="skill-modal-overlay hidden">
  <div id="skill-modal" class="skill-modal">
    <button id="skill-modal-close" class="skill-modal-close">✕</button>

    <h2 id="skill-modal-name" class="skill-modal-name"></h2>

    <div id="skill-modal-meta" class="skill-modal-meta"></div>

    <p id="skill-modal-description" class="skill-modal-description"></p>

    <div id="skill-modal-themes" class="skill-modal-themes"></div>

    <!-- This is where examples, project cards, devlog cards, and task cards will render -->
    <div id="skill-modal-links" class="skill-modal-links"></div>
  </div>
</div>

<!-- CARD COMPONENT STYLES -->
<link rel="stylesheet" href="/components/cards/card.css" />

<style>
  .skill-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .skill-modal-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .skill-modal {
    background: #0a1226;
    border: 1px solid #1a2a4a;
    border-radius: 14px;
    padding: 28px;
    width: min(600px, 90%);
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 0 20px rgba(79, 195, 255, 0.35);
    position: relative;
  }

  .skill-modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #0f1a33;
    border: 1px solid #1a2a4a;
    color: #9bb3d6;
    font-size: 1.2rem;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .skill-modal-close:hover {
    background: #4fc3ff;
    color: #000;
  }

  .skill-modal-name {
    color: #4fc3ff;
    font-size: 1.7rem;
    margin-bottom: 10px;
  }

  .skill-modal-meta {
    color: #9bb3d6;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }

  .skill-modal-description {
    color: #d8e2f3;
    line-height: 1.55;
    margin-bottom: 20px;
  }

  .skill-modal-themes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .skill-modal-theme-pill {
    padding: 4px 12px;
    background: #0f1a33;
    border: 1px solid #1a2a4a;
    border-radius: 12px;
    font-size: 0.8rem;
    color: #9bb3d6;
  }

  .skill-modal-links {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px; /* spacing between cards and sections */
  }

  .skill-modal-section-header {
    margin-top: 22px;
    margin-bottom: 8px;
    font-size: 1rem;
    color: #4fc3ff;
    font-weight: 600;
    border-bottom: 1px solid #1a2a4a;
    padding-bottom: 4px;
  }

  .skill-modal-examples-list {
    margin: 0 0 16px 0;
    padding-left: 20px;
    color: #d8e2f3;
    line-height: 1.55;
  }

  .skill-modal-examples-list li {
    margin-bottom: 6px;
  }

  /* Grid used for devlogs inside the modal */
  .skill-modal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    align-items: start;
  }

  .skill-modal-project-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* PARENT TREE - HIERARCHICAL LAYOUT */
  .skill-modal-parent-tree {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 16px 12px;
    width: 100%;
  }

  .skill-modal-tree-level {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Spacing between levels */
  .skill-modal-tree-level:not(:first-child) {
    padding-top: 20px;
  }

  .skill-modal-tree-node {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 50px;
  }

  /* Vertical connector from node down to next level */
  .skill-modal-tree-node::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    width: 2px;
    height: 20px;
    background: rgba(79, 195, 255, 0.25);
    transform: translateX(-50%);
  }

  .skill-modal-tree-node.current::after,
  .skill-modal-tree-node.last::after {
    display: none;
  }

  /* Circular node styling */
  .skill-modal-parent-node {
    position: relative;
    z-index: 2;
    width: 50px;
    height: 50px;
    border: 2px solid #1a2a4a;
    border-radius: 50%;
    background: #5a9fd4;
    color: #e8f0f9;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.65rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-wrap: break-word;
    overflow: hidden;
    padding: 4px;
    line-height: 1.1;
  }

  .skill-modal-parent-node:hover {
    background: #4fc3ff;
    color: #000;
    border-color: #4fc3ff;
    transform: scale(1.12);
    box-shadow: 0 0 12px rgba(79, 195, 255, 0.4);
  }

  /* Current skill node */
  .skill-modal-tree-node.current .skill-modal-parent-node {
    width: 60px;
    height: 60px;
    background: #4fc3ff;
    color: #000;
    border-color: #4fc3ff;
    box-shadow: 0 0 16px rgba(79, 195, 255, 0.6);
    font-size: 0.7rem;
    cursor: default;
  }

  .skill-modal-tree-node.current .skill-modal-parent-node:hover {
    transform: scale(1);
  }

  /* Horizontal connectors between siblings */
  .skill-modal-tree-level::before {
    content: "";
    position: absolute;
    top: -20px;
    left: 10%;
    right: 10%;
    height: 2px;
    background: rgba(79, 195, 255, 0.2);
    z-index: 0;
  }

  .skill-modal-tree-level:first-child::before {
    display: none;
  }

  .skill-modal-parent-none {
    color: #9bb3d6;
    font-size: 0.95rem;
    text-align: center;
    padding: 20px 0;
  }

  /* Scrollbar styling */
  .skill-modal::-webkit-scrollbar {
    width: 10px;
  }

  .skill-modal::-webkit-scrollbar-track {
    background: #0a1226;
    border-radius: 10px;
  }

  .skill-modal::-webkit-scrollbar-thumb {
    background: #1a2a4a;
    border-radius: 10px;
    border: 2px solid #0a1226;
  }

  .skill-modal::-webkit-scrollbar-thumb:hover {
    background: #4fc3ff;
  }


</style>
