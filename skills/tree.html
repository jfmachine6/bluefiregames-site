<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Tree v0.1.5 — BlueFire Games</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    body {
      background: #050914;
      color: #d8e2f3;
      margin: 0;
      overflow: hidden;
    }

    /* Push tree further below nav */
    #tree-container {
      position: absolute;
      top: 230px;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #tree-svg {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #0b1630 0, #050914 55%, #02040a 100%);
    }

    .tree-loader {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .node-label {
      fill: #d8e2f3;
      pointer-events: none;
      text-shadow: 0 0 4px #000;
    }

    .link-line {
      stroke: rgba(79, 195, 255, 0.25);
      stroke-width: 1.2px;
    }

    .link-line.highlight {
      stroke: #4fc3ff;
      stroke-width: 2px;
    }

    /* Buttons now below nav */
    .recenter-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 9999;
      padding: 8px 14px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      color: #4fc3ff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
      transition: 0.2s ease;
    }

    .recenter-btn:hover {
      background: #4fc3ff;
      color: #000;
      box-shadow: 0 0 12px rgba(79, 195, 255, 0.6);
    }

    .tree-version {
      position: absolute;
      bottom: 10px;
      left: 16px;
      font-size: 0.8rem;
      color: #6f7fa5;
      opacity: 0.8;
      z-index: 9999;
      pointer-events: none;
    }

    /* Search box */
    #skill-search {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 9999;
      width: 240px;
      padding: 8px 12px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 8px;
      color: #d8e2f3;
      font-size: 0.9rem;
    }

    #search-results {
      position: absolute;
      top: 60px;
      left: 20px;
      width: 240px;
      background: #0a1226;
      border: 1px solid #1a2a4a;
      border-radius: 8px;
      z-index: 9999;
      display: none;
      max-height: 260px;
      overflow-y: auto;
    }

    .search-item {
      padding: 8px 12px;
      cursor: pointer;
      color: #d8e2f3;
    }

    .search-item:hover {
      background: #1a2a4a;
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div id="tree-container">
  <svg id="tree-svg"></svg>

  <div class="tree-loader" id="tree-loader">
    <div class="loader"></div>
  </div>

  <input id="skill-search" placeholder="Search skills..." />
  <div id="search-results"></div>

  <button id="recenter-btn" class="recenter-btn">Recenter View</button>
  <div class="tree-version">Skill Tree v0.1.5</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

// Load Skill Modal Component
fetch("/components/skill-modal.html")
  .then(r => r.text())
  .then(html => {
    document.body.insertAdjacentHTML("beforeend", html);

    import("/components/skill-modal.js").then(module => {
      window.openSkillModal = module.openSkillModal;
      module.initSkillModal();
    });
  });

// Load tree logic (v0.1.5)
import("/components/skill-tree.js").then(module => {
  module.initSkillTree();
});
</script>

</body>
</html>
