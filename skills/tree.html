<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Tree — BlueFire Games</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    body {
      background: #050914;
      color: #d8e2f3;
      margin: 0;
      overflow: hidden;
    }

    #tree-container {
      position: absolute;
      inset: 0;
    }

    #tree-svg {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #0b1630 0, #050914 55%, #02040a 100%);
    }

    .tree-loader {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .node-circle {
      stroke: #1a2a4a;
      stroke-width: 1.5px;
      cursor: pointer;
    }

    .node-circle:hover {
      stroke: #4fc3ff;
      stroke-width: 2px;
      filter: drop-shadow(0 0 6px rgba(79, 195, 255, 0.7));
    }

    .node-label {
      fill: #d8e2f3;
      font-size: 10px;
      pointer-events: none;
      text-shadow: 0 0 4px #000;
    }

    .link-line {
      stroke: rgba(79, 195, 255, 0.25);
      stroke-width: 1.2px;
    }

    .link-line.highlight {
      stroke: #4fc3ff;
      stroke-width: 2px;
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div id="tree-container">
  <svg id="tree-svg"></svg>

  <div class="tree-loader" id="tree-loader">
    <div class="loader"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

// Load Skill Modal Component
fetch("/components/skill-modal.html")
  .then(r => r.text())
  .then(html => {
    document.body.insertAdjacentHTML("beforeend", html);

    import("/components/skill-modal.js").then(module => {
      window.openSkillModal = module.openSkillModal;
      module.initSkillModal();
    });
  });

// Load tree logic
import("/components/skill-tree.js").then(module => {
  module.initSkillTree();
});
</script>

</body>
</html>
