<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills — BlueFire Games</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    body {
      background: #050914;
      color: #d8e2f3;
    }

    /* --- HERO CONTENT (uses global .hero + .hero-overlay) --- */
    .skills-hero-content {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      padding: 0 20px;
    }

    .skills-hero-title {
      font-size: 3rem;
      color: #4fc3ff;
      margin-bottom: 10px;
      text-shadow: 0 0 12px rgba(79,195,255,0.5);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .skills-hero-subtitle {
      font-size: 1.15rem;
      color: #9bb3d6;
      margin-bottom: 28px;
      line-height: 1.55;
    }

    .skills-hero-button {
      display: inline-block;
      padding: 12px 26px;
      background: #0f1a33;
      border: 1px solid #4fc3ff;
      border-radius: 10px;
      color: #4fc3ff;
      font-size: 1.1rem;
      text-decoration: none;
      transition: 0.25s ease;
      box-shadow: 0 0 12px rgba(79,195,255,0.25);
      font-weight: 600;
    }

    .skills-hero-button:hover {
      background: #4fc3ff;
      color: #000;
      box-shadow: 0 0 18px rgba(79,195,255,0.6);
      transform: scale(1.05);
    }

    /* --- ORIGINAL PAGE STYLES (unchanged) --- */

    .skills-filter-container {
      max-width: 1100px;
      margin: 40px auto 20px auto;
      padding: 0 20px;
    }

    .page-title {
      color: #4fc3ff;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .skills-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0 30px 0;
    }

    .filter-input {
      padding: 8px 14px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 8px;
      color: #d8e2f3;
      font-size: 1rem;
      width: 260px;
    }

    .filter-select {
      padding: 8px 14px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 8px;
      color: #d8e2f3;
      font-size: 1rem;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      padding: 0 40px 60px 40px;
    }

    .skill-card {
      background: #0a1226;
      border: 1px solid #1a2a4a;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .skill-card:hover {
      transform: scale(1.02);
      border-color: #4fc3ff;
      box-shadow: 0 0 12px rgba(79, 195, 255, 0.35);
    }

    .skill-name {
      font-size: 1.2rem;
      color: #4fc3ff;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .skill-meta {
      font-size: 0.85rem;
      color: #9bb3d6;
      margin-bottom: 10px;
    }

    .theme-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .theme-pill {
      padding: 3px 10px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #9bb3d6;
    }

    .loader {
      margin: 40px auto;
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<!-- ============================================
     HERO BANNER (using global .hero styles)
     ============================================ -->
<div class="hero" style="
  background-image:
    radial-gradient(circle at top, rgba(79,195,255,0.18), rgba(0,0,0,0.6)),
    url('/assets/hero-skilltree-bg.jpg');
  background-size: cover;
  background-position: center;
">
  <div class="hero-overlay"></div>

  <div class="skills-hero-content">
    <h1 class="skills-hero-title">The Skill Tree</h1>
    <p class="skills-hero-subtitle">
      A living map of knowledge, progression, and mastery - inspired by classic RPG skill systems.
    </p>

    <a href="/skills/tree.html" class="skills-hero-button">
      Enter the Skill Tree
    </a>
  </div>
</div>

<!-- FILTERS SECTION -->
<div class="skills-filter-container fade-section" id="skills-filter-section">
  <h1 class="page-title">Skills</h1>

  <div class="skills-filters">
    <input id="search-input" class="filter-input" placeholder="Search skills..." />

    <select id="category-select" class="filter-select">
      <option value="">All Categories</option>
    </select>

    <select id="type-select" class="filter-select">
      <option value="">All Types</option>
    </select>
  </div>
</div>

<!-- GRID -->
<div id="skills-grid" class="skills-grid fade-section"></div>

<!-- LOADER -->
<div id="loader" class="section-loader">
  <div class="loader"></div>
</div>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

// Load Skill Modal Component
fetch("/components/skill-modal.html")
  .then(r => r.text())
  .then(html => {
    document.body.insertAdjacentHTML("beforeend", html);

    import("/components/skill-modal.js").then(module => {
      window.openSkillModal = module.openSkillModal;
      module.initSkillModal();
    });
  });

const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

let allSkills = [];

// Fetch skills
async function loadSkills() {
  const res = await fetch(`${WORKER}/skills`, {
    method: "GET",
    mode: "cors",
    cache: "no-store"
  });

  allSkills = await res.json();

  document.getElementById("loader").style.display = "none";

  populateFilters();
  renderSkills();

  document.getElementById("skills-filter-section").classList.add("visible");
  document.getElementById("skills-grid").classList.add("visible");
}

function populateFilters() {
  const categorySelect = document.getElementById("category-select");
  const typeSelect = document.getElementById("type-select");

  const categories = new Set();
  const types = new Set();

  allSkills.forEach(s => {
    if (s.category) categories.add(s.category);
    if (s.type) types.add(s.type);
  });

  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    categorySelect.appendChild(opt);
  });

  types.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  });
}

function renderSkills() {
  const grid = document.getElementById("skills-grid");
  grid.innerHTML = "";

  const search = document.getElementById("search-input").value.toLowerCase();
  const category = document.getElementById("category-select").value;
  const type = document.getElementById("type-select").value;

  allSkills
    .filter(s => {
      const matchesSearch =
        s.name.toLowerCase().includes(search) ||
        (s.themes || []).some(t => t.toLowerCase().includes(search));

      const matchesCategory = !category || s.category === category;
      const matchesType = !type || s.type === type;

      return matchesSearch && matchesCategory && matchesType;
    })
    .forEach(s => {
      const card = document.createElement("div");
      card.className = "skill-card";
      card.onclick = () => openSkillModal(s.id);

      const name = document.createElement("div");
      name.className = "skill-name";
      name.textContent = s.name;

      const meta = document.createElement("div");
      meta.className = "skill-meta";
      meta.textContent = `${s.category} • ${s.type}`;

      const themeRow = document.createElement("div");
      themeRow.className = "theme-row";

      (s.themes || []).forEach(t => {
        const pill = document.createElement("div");
        pill.className = "theme-pill";
        pill.textContent = t;
        themeRow.appendChild(pill);
      });

      card.appendChild(name);
      card.appendChild(meta);
      card.appendChild(themeRow);

      grid.appendChild(card);
    });
}

document.getElementById("search-input").addEventListener("input", renderSkills);
document.getElementById("category-select").addEventListener("change", renderSkills);
document.getElementById("type-select").addEventListener("change", renderSkills);

loadSkills();
</script>

</body>
</html>
