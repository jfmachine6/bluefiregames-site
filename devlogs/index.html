<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devlogs — BlueFire Games</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    body {
      background: #050914;
      color: #d8e2f3;
    }

    .page-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .page-title {
      color: #4fc3ff;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0 30px 0;
    }

    .filter-pill {
      padding: 6px 14px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s ease;
      color: #9bb3d6;
    }

    .filter-pill.active {
      background: #4fc3ff;
      color: #000;
      border-color: #4fc3ff;
      box-shadow: 0 0 10px rgba(79, 195, 255, 0.4);
    }

    .devlog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .devlog-card {
      background: #0a1226;
      border: 1px solid #1a2a4a;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.25s ease;
      cursor: pointer;
    }

    .devlog-card:hover {
      transform: scale(1.02);
      border-color: #4fc3ff;
      box-shadow: 0 0 12px rgba(79, 195, 255, 0.35);
    }

    .devlog-thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #0f1a33;
    }

    .devlog-info {
      padding: 14px 16px;
    }

    .devlog-title {
      font-size: 1.15rem;
      color: #4fc3ff;
      margin: 0 0 6px 0;
    }

    .devlog-date {
      font-size: 0.85rem;
      color: #9bb3d6;
      margin-bottom: 10px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-pill {
      padding: 3px 10px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #9bb3d6;
    }

    .loader {
      margin: 40px auto;
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="page-container">

  <h1 class="page-title">Devlogs</h1>

  <!-- FILTERS -->
  <div id="filters" class="filters"></div>

  <!-- GRID -->
  <div id="devlog-grid" class="devlog-grid"></div>

  <!-- LOADER -->
  <div id="loader" class="section-loader">
    <div class="loader"></div>
  </div>

</div>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

function createPill(label, active = false) {
  const pill = document.createElement("div");
  pill.className = "filter-pill" + (active ? " active" : "");
  pill.textContent = label;
  return pill;
}

function formatISO(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return d.toISOString().split("T")[0]; // YYYY-MM-DD
}

async function loadDevlogs() {
  const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

  const res = await fetch(`${WORKER}/devlogs`, {
    method: "GET",
    mode: "cors",
    cache: "no-store"
  });

  const devlogs = await res.json();

  document.getElementById("loader").style.display = "none";

  // Build tag cloud
  const tagSet = new Set();
  devlogs.forEach(d => (d.tags || []).forEach(t => tagSet.add(t)));

  const filters = document.getElementById("filters");

  // "All" pill
  const allPill = createPill("All", true);
  filters.appendChild(allPill);

  tagSet.forEach(tag => {
    const pill = createPill(tag);
    filters.appendChild(pill);
  });

  // Render grid
  const grid = document.getElementById("devlog-grid");

  function render(filterTag = null) {
    grid.innerHTML = "";

    devlogs
      .filter(d => !filterTag || d.tags.includes(filterTag))
      .forEach(d => {
        const card = document.createElement("div");
        card.className = "devlog-card";
        card.onclick = () => {
          window.location.href = `/devlogs/devlog.html?id=${d.id}`;
        };

        const img = document.createElement("img");
        img.className = "devlog-thumb";
        img.src = d.thumbnail || "/assets/default-thumb.png";

        const info = document.createElement("div");
        info.className = "devlog-info";

        const title = document.createElement("div");
        title.className = "devlog-title";
        title.textContent = d.title;

        const date = document.createElement("div");
        date.className = "devlog-date";
        date.textContent = formatISO(d.date);

        const tagRow = document.createElement("div");
        tagRow.className = "tag-row";

        (d.tags || []).forEach(t => {
          const tagPill = document.createElement("div");
          tagPill.className = "tag-pill";
          tagPill.textContent = t;
          tagRow.appendChild(tagPill);
        });

        info.appendChild(title);
        info.appendChild(date);
        info.appendChild(tagRow);

        card.appendChild(img);
        card.appendChild(info);
        grid.appendChild(card);
      });
  }

  render();

  // Filter logic
  filters.addEventListener("click", e => {
    if (!e.target.classList.contains("filter-pill")) return;

    document.querySelectorAll(".filter-pill").forEach(p =>
      p.classList.remove("active")
    );

    e.target.classList.add("active");

    const tag = e.target.textContent;
    if (tag === "All") render(null);
    else render(tag);
  });
}

loadDevlogs();
</script>

</body>
</html>
