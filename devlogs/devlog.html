<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Devlog — Bluefire Games</title>
<link href="/style.css" rel="stylesheet" type="text/css">
</head>

<body>

<div id="nav-placeholder"></div>

<!-- Loader -->
<div id="devlog-loading" class="section-loader">
    <div class="loader"></div>
</div>

<!-- Content Section -->
<div id="devlog-section" class="fade-section">

    <!-- Hero Banner -->
    <div class="hero" id="hero">
        <div class="hero-overlay"></div>
    </div>

    <div class="content-container">

        <h1 id="devlog-title" class="content-title"></h1>
        <div id="devlog-date" class="content-date"></div>

        <!-- Series Viewer -->
        <div id="series-viewer"></div>

        <!-- Devlog Content -->
        <div id="devlog-content"></div>

        <!-- Project return card -->
        <div id="project-return" class="project-return-card">
            <a id="back-link" class="project-return-link">
                <div class="project-return-layout">
                    <img id="project-return-thumb" class="project-return-thumb" />
                    <div class="project-return-text">
                        <div class="project-return-title">Back to Project</div>
                        <div id="project-return-name" class="project-return-name"></div>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>

<script src="/components/loader.js"></script>
<script src="/components/series-viewer.js"></script>

<script>
// Load nav
fetch("/nav.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("nav-placeholder").innerHTML = html;
    });

// Loader controller
const loader = createSectionLoaderController("devlog-loading", "devlog-section");
loader.show();

// Parse ?id=XYZ
const params = new URLSearchParams(window.location.search);
const devlogId = params.get("id");

// --- Notion Rich Text Renderer ---
function renderRichText(rich) {
    if (!rich || !rich.length) return "";
    return rich.map(t => {
        let text = t.plain_text || "";
        const a = t.annotations || {};

        if (a.code) text = `<code>${text}</code>`;
        if (a.bold) text = `<strong>${text}</strong>`;
        if (a.italic) text = `<em>${text}</em>`;
        if (a.strikethrough) text = `<s>${text}</s>`;
        if (a.underline) text = `<u>${text}</u>`;

        if (t.href) {
            text = `<a href="${t.href}" target="_blank">${text}</a>`;
        }

        return text;
    }).join("");
}

// --- Notion Block Renderer ---
function renderBlock(block) {
    const type = block.type;
    const el = document.createElement("div");
    el.className = "block";

    if (type === "paragraph") {
        el.innerHTML = renderRichText(block.paragraph.rich_text);
        return el;
    }

    if (type === "heading_1") {
        el.innerHTML = `<h2 class="content-title">${renderRichText(block.heading_1.rich_text)}</h2>`;
        return el;
    }

    if (type === "heading_2") {
        el.innerHTML = `<h3 style="color:#6faaff">${renderRichText(block.heading_2.rich_text)}</h3>`;
        return el;
    }

    if (type === "heading_3") {
        el.innerHTML = `<h4 style="color:#8fb8ff">${renderRichText(block.heading_3.rich_text)}</h4>`;
        return el;
    }

    if (type === "bulleted_list_item") {
        el.innerHTML = `• ${renderRichText(block.bulleted_list_item.rich_text)}`;
        return el;
    }

    if (type === "numbered_list_item") {
        el.innerHTML = `1. ${renderRichText(block.numbered_list_item.rich_text)}`;
        return el;
    }

    if (type === "to_do") {
        const checked = block.to_do.checked;
        el.innerHTML = `
            <label>
                <input type="checkbox" ${checked ? "checked" : ""} disabled>
                ${renderRichText(block.to_do.rich_text)}
            </label>
        `;
        return el;
    }

    if (type === "quote") {
        el.classList.add("quote");
        el.innerHTML = renderRichText(block.quote.rich_text);
        return el;
    }

    if (type === "divider") {
        el.innerHTML = `<hr>`;
        return el;
    }

    if (type === "code") {
        el.classList.add("code-block");
        el.textContent = block.code.rich_text.map(t => t.plain_text).join("");
        return el;
    }

    if (type === "callout") {
        el.classList.add("callout");
        const icon = block.callout.icon?.emoji || "💡";
        const inner = document.createElement("div");
        inner.className = "block";
        inner.innerHTML = renderRichText(block.callout.rich_text);

        el.innerHTML = `<div class="callout-icon">${icon}</div>`;
        el.appendChild(inner);
        return el;
    }

    if (type === "toggle") {
        el.classList.add("toggle");

        const summary = document.createElement("div");
        summary.className = "toggle-summary";
        summary.innerHTML = renderRichText(block.toggle.rich_text);

        const childrenContainer = document.createElement("div");
        childrenContainer.className = "toggle-children";
        childrenContainer.style.display = "none";

        (block.children || []).forEach(child => {
            childrenContainer.appendChild(renderBlock(child));
        });

        summary.addEventListener("click", () => {
            const visible = childrenContainer.style.display === "block";
            childrenContainer.style.display = visible ? "none" : "block";
        });

        el.appendChild(summary);
        el.appendChild(childrenContainer);
        return el;
    }

    if (type === "image") {
        const url = block.image.file?.url || block.image.external?.url;

        // ⭐ Skip series images so they only appear in the series viewer
        if (window.devlogData?.seriesImages?.includes(url)) {
            return document.createElement("div");
        }

        el.innerHTML = `<img src="${url}" alt="Devlog Image">`;
        return el;
    }

    if (type === "video") {
        const url = block.video.external?.url || block.video.file?.url;
        el.innerHTML = `
            <a href="${url}" target="_blank">
                🎬 Watch Video
            </a>
        `;
        return el;
    }

    if (type === "embed" || type === "bookmark") {
        const url = block[type].url;
        el.innerHTML = `
            <a href="${url}" target="_blank">
                🔗 ${url}
            </a>
        `;
        return el;
    }

    if (type === "column_list") {
        const wrapper = document.createElement("div");
        wrapper.className = "devlog-columns";

        (block.children || []).forEach(col => {
            const colDiv = document.createElement("div");
            colDiv.className = "devlog-column";

            (col.children || []).forEach(child => {
                colDiv.appendChild(renderBlock(child));
            });

            wrapper.appendChild(colDiv);
        });

        return wrapper;
    }

    if (type === "column") {
        const colDiv = document.createElement("div");
        colDiv.className = "devlog-column";
        (block.children || []).forEach(child => {
            colDiv.appendChild(renderBlock(child));
        });
        return colDiv;
    }

    el.textContent = `[Unsupported block type: ${type}]`;
    return el;
}

// --- Fetch Devlog ---
fetch(`https://bluefire-notion.jfedders6.workers.dev/devlog?id=${devlogId}`)
    .then(r => r.json())
    .then(devlog => {

        // Store globally so block renderer can skip series images
        window.devlogData = devlog;

        // Hero banner
        if (devlog.thumbnail) {
            document.getElementById("hero").style.backgroundImage =
                `url('${devlog.thumbnail}')`;
        }

        // Title
        document.getElementById("devlog-title").textContent = devlog.title;

        // Date (Worker update needed)
        document.getElementById("devlog-date").textContent = "";

        // Series viewer
        if (devlog.containsSeries && devlog.seriesImages && devlog.seriesImages.length) {
            renderSeriesViewer(devlog.seriesImages, "series-viewer");
        }

        // Blocks
        const container = document.getElementById("devlog-content");
        (devlog.blocks || []).forEach(block => {
            container.appendChild(renderBlock(block));
        });

        // Project return card
        if (devlog.projectName) {
            document.getElementById("project-return-name").textContent = devlog.projectName;
        }

        if (devlog.projectThumbnail) {
            document.getElementById("project-return-thumb").src = devlog.projectThumbnail;
        } else {
            document.getElementById("project-return-thumb").style.display = "none";
        }

        if (devlog.projectId) {
            document.getElementById("back-link").href =
                `/projects/project.html?id=${devlog.projectId}`;
        } else {
            document.getElementById("back-link").href = "/devlogs/";
            document.getElementById("project-return-name").textContent = "All Devlogs";
        }

        loader.hide();
    })
    .catch(err => {
        console.error("Error loading devlog:", err);
        loader.hide();
    });
</script>

</body>
</html>
