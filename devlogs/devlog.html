<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devlog — BlueFire Games</title>

  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/devlogs/devlog.css" />

  <style>
    /* DEVLOG CONTAINER */
    .devlog-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #0a1226;
      border-radius: 12px;
      border: 1px solid #1a2a4a;
    }

    /* DATE */
    .devlog-date {
      color: #9bb3d6;
      margin-top: -5px;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    /* DEVLOG CONTENT */
    #devlog-content p,
    #devlog-content h1,
    #devlog-content h2,
    #devlog-content h3,
    #devlog-content ul,
    #devlog-content ol,
    #devlog-content blockquote {
      margin: 16px 0;
      line-height: 1.55;
      color: #d8e2f3;
    }

    #devlog-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 20px auto;
      border-radius: 8px;
      border: 1px solid #1a2a4a;
    }

    figure {
      margin: 20px 0;
      text-align: center;
    }

    figcaption {
      font-size: 0.9rem;
      color: #8fa3d1;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<!-- NAV -->
<div id="nav-placeholder"></div>

<!-- HERO LOADER -->
<div id="hero-loader" class="section-loader">
  <div class="loader"></div>
</div>

<!-- GLOBAL HERO BANNER -->
<div id="devlog-hero" class="hero">
  <div class="hero-overlay"></div>
</div>

<!-- MAIN CONTENT -->
<div class="devlog-container">

  <!-- META LOADER -->
  <div id="meta-loader" class="section-loader">
    <div class="loader"></div>
  </div>

  <!-- TITLE + DATE -->
  <div id="devlog-meta" class="devlog-meta" style="display:none;">
    <h1 id="devlog-title" class="content-title"></h1>
    <p id="devlog-date" class="devlog-date"></p>
  </div>

  <!-- SERIES VIEWER -->
  <section id="series-viewer"></section>

  <!-- CONTENT LOADER -->
  <div id="content-loader" class="section-loader">
    <div class="loader"></div>
  </div>

  <!-- CONTENT BLOCKS -->
  <div id="devlog-content"></div>

  <!-- PROJECT FOOTER -->
  <section id="project-footer" class="project-footer">
    <img id="project-thumb" class="project-thumb" />
    <div class="project-info">
      <h2 id="project-title"></h2>
      <p id="project-desc"></p>
      <a id="project-link" class="project-link">View Project</a>
    </div>
  </section>

  <a href="/devlogs/" class="back-link" style="margin-top:30px; display:inline-block;">
    ← Back to Devlogs
  </a>
</div>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;

    const nav = document.querySelector('.navbar');
    if (!nav) return;

    let lastScroll = 0;
    window.addEventListener('scroll', () => {
      const current = window.scrollY;
      if (current > lastScroll && current > 50) nav.classList.add('hidden');
      else nav.classList.remove('hidden');
      lastScroll = current;
    });
  });
</script>

<script>
// Utility
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// Render blocks
function renderBlocks(blocks, seriesBlockIds) {
  const container = document.getElementById("devlog-content");
  if (!blocks) return;

  const supported = [
    "paragraph",
    "heading_1",
    "heading_2",
    "heading_3",
    "bulleted_list_item",
    "numbered_list_item",
    "quote",
    "callout",
    "image"
  ];

  for (const block of blocks) {
    if (!block || !block.type) continue;
    if (seriesBlockIds.includes(block.id)) continue;
    if (!supported.includes(block.type)) continue;

    const type = block.type;

    if (type === "paragraph") {
      const p = el("p");
      block.paragraph.rich_text.forEach(rt => p.append(rt.plain_text));
      container.appendChild(p);
    }

    if (type === "heading_1") {
      const h = el("h1");
      block.heading_1.rich_text.forEach(rt => h.append(rt.plain_text));
      container.appendChild(h);
    }

    if (type === "heading_2") {
      const h = el("h2");
      block.heading_2.rich_text.forEach(rt => h.append(rt.plain_text));
      container.appendChild(h);
    }

    if (type === "heading_3") {
      const h = el("h3");
      block.heading_3.rich_text.forEach(rt => h.append(rt.plain_text));
      container.appendChild(h);
    }

    if (type === "bulleted_list_item") {
      const ul = container.lastElementChild?.tagName === "UL"
        ? container.lastElementChild
        : el("ul");

      const li = el("li");
      block.bulleted_list_item.rich_text.forEach(rt => li.append(rt.plain_text));
      ul.appendChild(li);

      if (ul.parentNode !== container) container.appendChild(ul);
    }

    if (type === "numbered_list_item") {
      const ol = container.lastElementChild?.tagName === "OL"
        ? container.lastElementChild
        : el("ol");

      const li = el("li");
      block.numbered_list_item.rich_text.forEach(rt => li.append(rt.plain_text));
      ol.appendChild(li);

      if (ol.parentNode !== container) container.appendChild(ol);
    }

    if (type === "quote") {
      const q = el("blockquote");
      block.quote.rich_text.forEach(rt => q.append(rt.plain_text));
      container.appendChild(q);
    }

    if (type === "callout") {
      const div = el("div", "callout");
      block.callout.rich_text.forEach(rt => div.append(rt.plain_text));
      container.appendChild(div);
    }

    if (type === "image") {
      const url = block.image.type === "file"
        ? block.image.file.url
        : block.image.external.url;

      const img = el("img");
      img.src = url;

      const fig = el("figure");
      fig.appendChild(img);

      const caption = block.image.caption.map(c => c.plain_text).join("");
      if (caption) {
        const cap = el("figcaption");
        cap.textContent = caption;
        fig.appendChild(cap);
      }

      container.appendChild(fig);
    }
  }
}
</script>

<script>
function formatDate(d) {
  if (!d) return "";
  const date = new Date(d);
  return date.toLocaleDateString(undefined, {
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

async function loadDevlog() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return;

  const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

  const res = await fetch(`${WORKER}/devlog/${id}`, {
    method: "GET",
    mode: "cors",
    cache: "no-store"
  });

  const data = await res.json();

  /* HERO (global hero banner) */
  const hero = document.getElementById("devlog-hero");
  if (data.thumbnail) {
    hero.style.backgroundImage = `url('${data.thumbnail}')`;
  }
  document.getElementById("hero-loader").style.display = "none";

  /* META */
  document.getElementById("devlog-title").textContent = data.title || "Untitled Devlog";
  document.getElementById("devlog-date").textContent = formatDate(data.date);

  document.getElementById("meta-loader").style.display = "none";
  document.getElementById("devlog-meta").style.display = "block";

  /* SERIES VIEWER */
  const seriesImages = (data.blocks || [])
    .filter(b => data.seriesBlockIds.includes(b.id) && b.type === "image")
    .map(b => ({
      url: b.image.type === "file" ? b.image.file.url : b.image.external.url
    }));

  if (seriesImages.length > 0) {
    renderSeriesViewer(seriesImages, "series-viewer");
  }

  /* CONTENT */
  try {
    if (data.blocks) {
      renderBlocks(data.blocks, data.seriesBlockIds || []);
    }
  } catch (err) {
    console.error("Block rendering error:", err);
  }

  document.getElementById("content-loader").style.display = "none";
  document.getElementById("devlog-content").style.display = "block";

  /* PROJECT FOOTER */
  if (data.project) {
    document.getElementById("project-title").textContent = data.project.title;
    document.getElementById("project-desc").textContent = data.project.description || "";
    document.getElementById("project-link").href = `/projects/project.html?id=${data.project.id}`;

    if (data.project.thumbnail) {
      document.getElementById("project-thumb").src = data.project.thumbnail;
    }
  } else {
    document.getElementById("project-footer").style.display = "none";
  }
}

loadDevlog();
</script>

<!-- Reusable Series Viewer -->
<script src="/components/series-viewer.js" defer></script>

<!-- Loader script -->
<script src="/components/loader.js" defer></script>

</body>
</html>
