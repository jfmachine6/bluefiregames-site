<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueFire Games | DevLog</title>

  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/devlogs/devlog.css" />

  <style>
    /* DEVLOG CONTAINER */
    .devlog-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #0a1226;
      border-radius: 12px;
      border: 1px solid #1a2a4a;
    }

    /* DATE */
    .devlog-date {
      color: #9bb3d6;
      margin-top: -5px;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    /* DEVLOG CONTENT */
    #devlog-content p,
    #devlog-content h1,
    #devlog-content h2,
    #devlog-content h3,
    #devlog-content ul,
    #devlog-content ol,
    #devlog-content blockquote {
      margin: 16px 0;
      line-height: 1.55;
      color: #d8e2f3;
    }

    #devlog-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 20px auto;
      border-radius: 8px;
      border: 1px solid #1a2a4a;
    }

    figure {
      margin: 20px 0;
      text-align: center;
    }

    figcaption {
      font-size: 0.9rem;
      color: #8fa3d1;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<!-- NAV -->
<div id="nav-placeholder"></div>

<!-- HERO LOADER -->
<div id="hero-loader" class="section-loader">
  <div class="loader"></div>
</div>

<!-- GLOBAL HERO BANNER -->
<div id="devlog-hero" class="hero">
  <div class="hero-overlay"></div>
</div>

<!-- MAIN CONTENT -->
<div class="devlog-container">

  <!-- META LOADER -->
  <div id="meta-loader" class="section-loader">
    <div class="loader"></div>
  </div>

  <!-- TITLE + DATE -->
  <div id="devlog-meta" class="devlog-meta" style="display:none;">
    <h1 id="devlog-title" class="content-title"></h1>
    <p id="devlog-date" class="devlog-date"></p>
  </div>

  <!-- SERIES VIEWER -->
  <section id="series-viewer"></section>

  <!-- CONTENT LOADER -->
  <div id="content-loader" class="section-loader">
    <div class="loader"></div>
  </div>

  <!-- CONTENT BLOCKS -->
  <div id="devlog-content"></div>

  <!-- PROJECT FOOTER -->
  <section id="project-footer" class="project-footer">
    <img id="project-thumb" class="project-thumb" />
    <div class="project-info">
      <h2 id="project-title"></h2>
      <p id="project-desc"></p>
      <a id="project-link" class="project-link">View Project</a>
    </div>
  </section>

</div>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;

    const nav = document.querySelector('.navbar');
    if (!nav) return;

    let lastScroll = 0;
    window.addEventListener('scroll', () => {
      const current = window.scrollY;
      if (current > lastScroll && current > 50) nav.classList.add('hidden');
      else nav.classList.remove('hidden');
      lastScroll = current;
    });
  });
</script>

<script>
// Utility
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

/* HIDE SERIES MARKERS */
function isSeriesMarker(block) {
  if (!block || !block.type) return false;
  if (!["paragraph", "heading_1", "heading_2", "heading_3"].includes(block.type)) return false;

  const text = (block[block.type].rich_text || [])
    .map(rt => rt.plain_text)
    .join("");

  return text.includes("#SeriesStart") ||
         text.includes("#SeriesEnd") ||
         text.includes("#Series--") ||
         text.includes("#--Series");
}

function renderBlocks(blocks, seriesBlockIds) {
  const container = document.getElementById("devlog-content");
  if (!blocks) return;

  function renderRichText(rts) {
    return rts.map(rt => rt.plain_text).join("");
  }

  function renderChildren(children, parentEl) {
    children.forEach(child => renderBlock(child, parentEl));
  }

  function youtubeToEmbed(url) {
    if (!url.includes("youtube.com") && !url.includes("youtu.be")) return url;

    // youtu.be/ID
    if (url.includes("youtu.be")) {
      const id = url.split("youtu.be/")[1].split("?")[0];
      return `https://www.youtube.com/embed/${id}`;
    }

    // youtube.com/watch?v=ID
    const params = new URL(url).searchParams;
    const id = params.get("v");
    return id ? `https://www.youtube.com/embed/${id}` : url;
  }

  function renderBlock(block, parent) {
    if (!block || !block.type) return;
    if (seriesBlockIds.includes(block.id)) return;
    if (isSeriesMarker(block)) return;

    const type = block.type;

    // -----------------------------
    // PARAGRAPH
    // -----------------------------
    if (type === "paragraph") {
      const p = el("p");
      p.textContent = renderRichText(block.paragraph.rich_text);
      parent.appendChild(p);
      return;
    }

    // -----------------------------
    // HEADINGS
    // -----------------------------
    if (type === "heading_1") {
      const h = el("h1");
      h.textContent = renderRichText(block.heading_1.rich_text);
      parent.appendChild(h);
      return;
    }

    if (type === "heading_2") {
      const h = el("h2");
      h.textContent = renderRichText(block.heading_2.rich_text);
      parent.appendChild(h);
      return;
    }

    if (type === "heading_3") {
      const h = el("h3");
      h.textContent = renderRichText(block.heading_3.rich_text);
      parent.appendChild(h);
      return;
    }

    // -----------------------------
    // BULLETED LIST
    // -----------------------------
    if (type === "bulleted_list_item") {
      const ul = parent.lastElementChild?.tagName === "UL"
        ? parent.lastElementChild
        : el("ul");

      const li = el("li");
      li.textContent = renderRichText(block.bulleted_list_item.rich_text);
      ul.appendChild(li);

      if (ul.parentNode !== parent) parent.appendChild(ul);

      renderChildren(block.children, li);
      return;
    }

    // -----------------------------
    // NUMBERED LIST
    // -----------------------------
    if (type === "numbered_list_item") {
      const ol = parent.lastElementChild?.tagName === "OL"
        ? parent.lastElementChild
        : el("ol");

      const li = el("li");
      li.textContent = renderRichText(block.numbered_list_item.rich_text);
      ol.appendChild(li);

      if (ol.parentNode !== parent) parent.appendChild(ol);

      renderChildren(block.children, li);
      return;
    }

    // -----------------------------
    // QUOTE
    // -----------------------------
    if (type === "quote") {
      const q = el("blockquote");
      q.textContent = renderRichText(block.quote.rich_text);
      parent.appendChild(q);
      return;
    }

    // -----------------------------
    // CALLOUT
    // -----------------------------
    if (type === "callout") {
      const div = el("div", "callout");
      div.textContent = renderRichText(block.callout.rich_text);
      parent.appendChild(div);

      renderChildren(block.children, div);
      return;
    }

    // -----------------------------
    // IMAGE
    // -----------------------------
    if (type === "image") {
      const url = block.image.type === "file"
        ? block.image.file.url
        : block.image.external.url;

      const fig = el("figure");
      const img = el("img");
      img.src = url;
      fig.appendChild(img);

      const caption = block.image.caption.map(c => c.plain_text).join("");
      if (caption) {
        const cap = el("figcaption");
        cap.textContent = caption;
        fig.appendChild(cap);
      }

      parent.appendChild(fig);
      return;
    }

    // -----------------------------
    // DIVIDER
    // -----------------------------
    if (type === "divider") {
      parent.appendChild(el("hr"));
      return;
    }

    // -----------------------------
    // CODE BLOCK
    // -----------------------------
    if (type === "code") {
      const pre = el("pre");
      const code = el("code");
      code.textContent = renderRichText(block.code.rich_text);
      pre.appendChild(code);
      parent.appendChild(pre);
      return;
    }

    // -----------------------------
    // TOGGLE
    // -----------------------------
    if (type === "toggle") {
      const details = el("details");
      const summary = el("summary");
      summary.textContent = renderRichText(block.toggle.rich_text);
      details.appendChild(summary);

      renderChildren(block.children, details);
      parent.appendChild(details);
      return;
    }

    // -----------------------------
    // EMBED
    // -----------------------------
    if (type === "embed") {
      const a = el("a");
      a.href = block.embed.url;
      a.textContent = block.embed.url;
      a.target = "_blank";
      parent.appendChild(a);
      return;
    }

    // -----------------------------
    // VIDEO (YouTube, Vimeo, File)
    // -----------------------------
    if (type === "video") {
      let url = block.video.type === "external"
        ? block.video.external.url
        : block.video.file.url;

      // Convert YouTube links
      url = youtubeToEmbed(url);

      // Uploaded video file
      if (block.video.type === "file") {
        const video = el("video", "video-file");
        video.src = url;
        video.controls = true;
        parent.appendChild(video);
        return;
      }

      // External embed (YouTube, Vimeo)
      const iframe = el("iframe", "video-embed");
      iframe.src = url;
      iframe.allow = "fullscreen";
      parent.appendChild(iframe);
      return;
    }

    // -----------------------------
    // BOOKMARK
    // -----------------------------
    if (type === "bookmark") {
      const a = el("a", "bookmark");
      a.href = block.bookmark.url;
      a.textContent = block.bookmark.url;
      a.target = "_blank";
      parent.appendChild(a);
      return;
    }

    // -----------------------------
    // COLUMN LIST
    // -----------------------------
    if (type === "column_list") {
      const row = el("div", "columns");
      parent.appendChild(row);

      block.children.forEach(col => {
        const colDiv = el("div", "column");
        row.appendChild(colDiv);
        renderChildren(col.children, colDiv);
      });

      return;
    }

    // -----------------------------
    // COLUMN (handled above)
    // -----------------------------
    if (type === "column") {
      const colDiv = el("div", "column");
      parent.appendChild(colDiv);
      renderChildren(block.children, colDiv);
      return;
    }
  }

  blocks.forEach(block => renderBlock(block, container));
}


</script>

<script>
function formatDate(d) {
  if (!d) return "";
  const date = new Date(d);
  return date.toLocaleDateString(undefined, {
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

async function loadDevlog() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return;

  const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

  const res = await fetch(`${WORKER}/devlog/${id}`, {
    method: "GET",
    mode: "cors",
    cache: "no-store"
  });

  const data = await res.json();

  /* HERO (global hero banner) */
  const hero = document.getElementById("devlog-hero");
  if (data.thumbnail) {
    hero.style.backgroundImage = `url('${data.thumbnail}')`;
  }
  document.getElementById("hero-loader").style.display = "none";

  /* META */
  document.getElementById("devlog-title").textContent = data.title || "Untitled Devlog";
  document.getElementById("devlog-date").textContent = formatDate(data.date);

  document.getElementById("meta-loader").style.display = "none";
  document.getElementById("devlog-meta").style.display = "block";

  /* SERIES VIEWER */
  const seriesImages = (data.blocks || [])
    .filter(b => data.seriesBlockIds.includes(b.id) && b.type === "image")
    .map(b => ({
      url: b.image.type === "file" ? b.image.file.url : b.image.external.url
    }));

  if (seriesImages.length > 0) {
    renderSeriesViewer(seriesImages, "series-viewer");
  }

  /* CONTENT */
  try {
    if (data.blocks) {
      renderBlocks(data.blocks, data.seriesBlockIds || []);
    }
  } catch (err) {
    console.error("Block rendering error:", err);
  }

  document.getElementById("content-loader").style.display = "none";
  document.getElementById("devlog-content").style.display = "block";

  /* PROJECT FOOTER */
  if (data.project) {
    document.getElementById("project-title").textContent = data.project.title;
    document.getElementById("project-desc").textContent = data.project.description || "";
    document.getElementById("project-link").href = `/projects/project.html?id=${data.project.id}`;

    if (data.project.thumbnail) {
      document.getElementById("project-thumb").src = data.project.thumbnail;
    }
  } else {
    document.getElementById("project-footer").style.display = "none";
  }
}

loadDevlog();
</script>

<!-- Reusable Series Viewer -->
<script src="/components/series-viewer.js" defer></script>

<!-- Loader script -->
<script src="/components/loader.js" defer></script>

</body>
</html>
