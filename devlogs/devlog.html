<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Devlog — Bluefire Games</title>
    <link href="/style.css" rel="stylesheet" type="text/css">

    <style>
        body {
            background: #050914;
            color: #cdd7ff;
        }

        .devlog-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #0a1226;
            border-radius: 12px;
            border: 1px solid #1a2a4a;
        }

        /* HERO */
        .hero-wrapper {
            position: relative;
            width: 100%;
            height: 380px; /* Fixed height for loader stability */
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            background: #0f1a33;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .devlog-hero {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Hidden until loaded */
        }

        /* METADATA */
        .devlog-meta {
            margin-bottom: 20px;
            display: none; /* Hidden until loaded */
        }

        .devlog-meta h1 {
            color: #4fc3ff;
            margin-bottom: 10px;
        }

        .devlog-meta a {
            color: #8fb8ff;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .devlog-meta a:hover {
            color: #ffffff;
        }

        .devlog-tags {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-pill {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 999px;
            background: #111a35;
            border: 1px solid #1a3cff;
            color: #cdd7ff;
        }

        /* CONTENT */
        #devlog-content {
            display: none; /* Hidden until loaded */
            margin-top: 20px;
        }

        /* Loader spacing */
        .section-loader {
            padding: 40px 0;
        }
    </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="devlog-container">

    <!-- ⭐ HERO LOADER -->
    <div id="hero-loader" class="section-loader">
        <div class="loader"></div>
    </div>

    <!-- HERO IMAGE -->
    <div class="hero-wrapper">
        <img id="devlog-hero" class="devlog-hero" src="" alt="">
    </div>

    <!-- ⭐ METADATA LOADER -->
    <div id="meta-loader" class="section-loader">
        <div class="loader"></div>
    </div>

    <!-- METADATA -->
    <div id="devlog-meta" class="devlog-meta">
        <h1 id="devlog-title"></h1>
        <a id="project-link"></a>
        <div id="devlog-tags" class="devlog-tags"></div>
    </div>

    <!-- ⭐ CONTENT LOADER -->
    <div id="content-loader" class="section-loader">
        <div class="loader"></div>
    </div>

    <!-- CONTENT BLOCKS -->
    <div id="devlog-content"></div>

    <a href="/devlogs/" class="back-link" style="margin-top:30px; display:inline-block;">
        ← Back to Devlogs
    </a>
</div>

<script>
// Load navigation
fetch("/nav.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("nav-placeholder").innerHTML = html;

        const nav = document.querySelector('.navbar');
        if (!nav) return;

        let lastScroll = 0;
        window.addEventListener('scroll', () => {
            const current = window.scrollY;
            if (current > lastScroll && current > 50) nav.classList.add('hidden');
            else nav.classList.remove('hidden');
            lastScroll = current;
        });
    });
</script>

<script>
// --- Include your renderRichText + renderBlock functions here ---

const params = new URLSearchParams(window.location.search);
const devlogId = params.get("id");

fetch(`https://bluefire-notion.jfedders6.workers.dev/devlog?id=${devlogId}`)
    .then(r => r.json())
    .then(devlog => {

        /* ---------------------------
           HERO SECTION
        ---------------------------- */
        const heroImg = document.getElementById("devlog-hero");

        if (devlog.thumbnail) {
            heroImg.src = devlog.thumbnail;
            heroImg.onload = () => {
                document.getElementById("hero-loader").style.display = "none";
                heroImg.style.display = "block";
            };
        } else {
            document.getElementById("hero-loader").style.display = "none";
        }

        /* ---------------------------
           METADATA SECTION
        ---------------------------- */
        document.getElementById("devlog-title").textContent = devlog.title;

        if (devlog.projectId && devlog.projectName) {
            const link = document.getElementById("project-link");
            link.href = `/projects/project.html?id=${devlog.projectId}`;
            link.textContent = `← Back to ${devlog.projectName}`;
        }

        const tagContainer = document.getElementById("devlog-tags");
        if (devlog.tags && devlog.tags.length > 0) {
            devlog.tags.forEach(tag => {
                const pill = document.createElement("span");
                pill.className = "tag-pill";
                pill.textContent = tag;
                tagContainer.appendChild(pill);
            });
        }

        document.getElementById("meta-loader").style.display = "none";
        document.getElementById("devlog-meta").style.display = "block";

        /* ---------------------------
           CONTENT SECTION
        ---------------------------- */
        const content = document.getElementById("devlog-content");

        (devlog.blocks || []).forEach(block => {
            content.appendChild(renderBlock(block));
        });

        document.getElementById("content-loader").style.display = "none";
        content.style.display = "block";
    })
    .catch(err => {
        console.error("Error loading devlog:", err);
        document.getElementById("hero-loader").style.display = "none";
        document.getElementById("meta-loader").style.display = "none";
        document.getElementById("content-loader").style.display = "none";
    });
</script>

</body>
</html>
