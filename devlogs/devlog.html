<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devlog</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <nav id="navbar"></nav>

  <main id="content">
    <section id="hero" class="hero-section">
      <img id="hero-img" class="hero-img" />
      <div class="hero-meta">
        <h1 id="devlog-title"></h1>
        <p id="devlog-date" class="devlog-date"></p>
      </div>
    </section>

    <section id="series-viewer" class="series-viewer"></section>

    <section id="devlog-body" class="devlog-body"></section>

    <section id="devlog-nav" class="devlog-nav">
      <a id="prev-devlog" class="nav-btn prev"></a>
      <a id="next-devlog" class="nav-btn next"></a>
    </section>

    <section id="project-footer" class="project-footer">
      <img id="project-thumb" class="project-thumb" />
      <div class="project-info">
        <h2 id="project-title"></h2>
        <p id="project-desc"></p>
        <a id="project-link" class="project-link">View Project</a>
      </div>
    </section>
  </main>

  <script>
    // ------------------------------------------------------------
    // UTILITIES
    // ------------------------------------------------------------
    function el(tag, cls) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      return e;
    }

    function text(t) {
      return document.createTextNode(t);
    }

    function formatDate(d) {
      if (!d) return "";
      const date = new Date(d);
      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    // ------------------------------------------------------------
    // RENDER BLOCKS (skip series images)
    // ------------------------------------------------------------
    function renderBlocks(blocks, seriesBlockIds) {
      const container = document.getElementById("devlog-body");

      for (const block of blocks) {
        // Skip series images
        if (seriesBlockIds.includes(block.id)) continue;

        const type = block.type;

        // -------------------------
        // TEXT BLOCKS
        // -------------------------
        if (type === "paragraph") {
          const p = el("p");
          block.paragraph.rich_text.forEach(rt => {
            p.append(rt.plain_text);
          });
          container.appendChild(p);
        }

        if (type === "heading_1") {
          const h = el("h1");
          block.heading_1.rich_text.forEach(rt => h.append(rt.plain_text));
          container.appendChild(h);
        }

        if (type === "heading_2") {
          const h = el("h2");
          block.heading_2.rich_text.forEach(rt => h.append(rt.plain_text));
          container.appendChild(h);
        }

        if (type === "heading_3") {
          const h = el("h3");
          block.heading_3.rich_text.forEach(rt => h.append(rt.plain_text));
          container.appendChild(h);
        }

        if (type === "bulleted_list_item") {
          const ul = container.lastElementChild?.tagName === "UL"
            ? container.lastElementChild
            : el("ul");

          const li = el("li");
          block.bulleted_list_item.rich_text.forEach(rt =>
            li.append(rt.plain_text)
          );
          ul.appendChild(li);

          if (ul.parentNode !== container) container.appendChild(ul);
        }

        if (type === "numbered_list_item") {
          const ol = container.lastElementChild?.tagName === "OL"
            ? container.lastElementChild
            : el("ol");

          const li = el("li");
          block.numbered_list_item.rich_text.forEach(rt =>
            li.append(rt.plain_text)
          );
          ol.appendChild(li);

          if (ol.parentNode !== container) container.appendChild(ol);
        }

        if (type === "quote") {
          const q = el("blockquote");
          block.quote.rich_text.forEach(rt => q.append(rt.plain_text));
          container.appendChild(q);
        }

        if (type === "callout") {
          const div = el("div", "callout");
          block.callout.rich_text.forEach(rt => div.append(rt.plain_text));
          container.appendChild(div);
        }

        // -------------------------
        // IMAGES (non-series)
        // -------------------------
        if (type === "image") {
          const url =
            block.image.type === "file"
              ? block.image.file.url
              : block.image.external.url;

          const img = el("img", "devlog-img");
          img.src = url;

          const fig = el("figure");
          fig.appendChild(img);

          const caption = block.image.caption
            .map(c => c.plain_text)
            .join("");

          if (caption) {
            const cap = el("figcaption");
            cap.textContent = caption;
            fig.appendChild(cap);
          }

          container.appendChild(fig);
        }
      }
    }

    // ------------------------------------------------------------
    // RENDER SERIES VIEWER
    // ------------------------------------------------------------
    function renderSeries(blocks, seriesBlockIds) {
      const viewer = document.getElementById("series-viewer");
      viewer.innerHTML = "";

      if (!seriesBlockIds.length) return;

      for (const block of blocks) {
        if (!seriesBlockIds.includes(block.id)) continue;
        if (block.type !== "image") continue;

        const url =
          block.image.type === "file"
            ? block.image.file.url
            : block.image.external.url;

        const img = el("img", "series-img");
        img.src = url;

        viewer.appendChild(img);
      }
    }

    // ------------------------------------------------------------
    // LOAD DEVLOG
    // ------------------------------------------------------------
    async function loadDevlog() {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) return;

      const res = await fetch(`/devlog/${id}`);
      const data = await res.json();

      // HERO
      document.getElementById("devlog-title").textContent = data.title;
      document.getElementById("devlog-date").textContent = formatDate(data.date);

      if (data.thumbnail) {
        document.getElementById("hero-img").src = data.thumbnail;
      }

      // SERIES
      renderSeries(data.blocks, data.seriesBlockIds);

      // BODY
      renderBlocks(data.blocks, data.seriesBlockIds);

      // NEXT / PREV
      const prev = document.getElementById("prev-devlog");
      const next = document.getElementById("next-devlog");

      if (data.prev) {
        prev.textContent = `← ${data.prev.title}`;
        prev.href = `/devlogs/devlog.html?id=${data.prev.id}`;
      } else {
        prev.style.display = "none";
      }

      if (data.next) {
        next.textContent = `${data.next.title} →`;
        next.href = `/devlogs/devlog.html?id=${data.next.id}`;
      } else {
        next.style.display = "none";
      }

      // PROJECT FOOTER
      if (data.project) {
        document.getElementById("project-title").textContent =
          data.project.title;

        document.getElementById("project-desc").textContent =
          data.project.description || "";

        if (data.project.thumbnail) {
          document.getElementById("project-thumb").src =
            data.project.thumbnail;
        }

        document.getElementById("project-link").href =
          `/projects/project.html?id=${data.project.id}`;
      } else {
        document.getElementById("project-footer").style.display = "none";
      }
    }

    loadDevlog();
  </script>
</body>
</html>
