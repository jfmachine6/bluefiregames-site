<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Devlog — Bluefire Games</title>
    <link href="/style.css" rel="stylesheet" type="text/css">

    <style>
        body {
            background: #050914;
        }

        .devlog-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #0a1226;
            border-radius: 12px;
            border: 1px solid #1a2a4a;
        }

        .devlog-hero {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        h1 {
            color: #4fc3ff;
            margin-bottom: 12px;
        }

        .block {
            margin-bottom: 16px;
            color: #cdd7ff;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .block img {
            max-width: 100%;
            border-radius: 10px;
            margin: 12px 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 16px;
            background: #1a3cff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-link:hover {
            background: #4f6dff;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="devlog-container">
    <img id="devlog-thumb" class="devlog-hero" src="" alt="">

    <h1 id="devlog-title"></h1>

    <div id="devlog-content"></div>

    <a id="back-link" class="back-link">← Back to Project</a>
</div>

	    <!-- Load navigation -->
	<script>
	// Load navigation bar
	fetch("/nav.html")
		.then(r => r.text())
		.then(html => {
			document.getElementById("nav-placeholder").innerHTML = html;

			// After nav loads, enable sticky fade behavior
			const nav = document.querySelector('.navbar');
			let lastScroll = 0;

			window.addEventListener('scroll', () => {
				const current = window.scrollY;

				if (current > lastScroll && current > 50) {
					nav.classList.add('hidden');   // fade out
				} else {
					nav.classList.remove('hidden'); // fade in
				}

				lastScroll = current;
			});
		});
	</script>

	
	<script>
		// Parse ?id=XYZ
		const params = new URLSearchParams(window.location.search);
		const devlogId = params.get("id");

		// Fetch full devlog content
		fetch(`https://bluefire-notion.jfedders6.workers.dev/devlog?id=${devlogId}`)
			.then(r => r.json())
			.then(async devlog => {
				document.getElementById("devlog-title").textContent = devlog.title;

				// Fetch all devlogs to get thumbnail
				const allDevlogs = await fetch(`https://bluefire-notion.jfedders6.workers.dev/devlogs?projectId=none`)
					.then(r => r.json())
					.catch(() => []);

				const match = allDevlogs.find(d => d.id === devlogId);
				if (match && match.thumbnail) {
					document.getElementById("devlog-thumb").src = match.thumbnail;
				}

				// Render blocks
				const container = document.getElementById("devlog-content");

				devlog.blocks.forEach(block => {
					const div = document.createElement("div");
					div.className = "block";

					if (block.type === "paragraph") {
						div.textContent = block.paragraph.rich_text.map(t => t.plain_text).join("");
					}

					if (block.type === "heading_1") {
						div.innerHTML = `<h2 style="color:#4fc3ff">${block.heading_1.rich_text.map(t => t.plain_text).join("")}</h2>`;
					}

					if (block.type === "heading_2") {
						div.innerHTML = `<h3 style="color:#6faaff">${block.heading_2.rich_text.map(t => t.plain_text).join("")}</h3>`;
					}

					if (block.type === "bulleted_list_item") {
						div.innerHTML = `• ${block.bulleted_list_item.rich_text.map(t => t.plain_text).join("")}`;
					}

					if (block.type === "numbered_list_item") {
						div.innerHTML = `1. ${block.numbered_list_item.rich_text.map(t => t.plain_text).join("")}`;
					}

					if (block.type === "image") {
						const url = block.image.file?.url || block.image.external?.url;
						div.innerHTML = `<img src="${url}" alt="Devlog Image">`;
					}

					container.appendChild(div);
				});

				// ⭐ Back button → return to the correct project
				if (devlog.projectId) {
					document.getElementById("back-link").href =
						`/projects/project.html?id=${devlog.projectId}`;
				} else {
					document.getElementById("back-link").href = "/projects/";
				}
			})
			.catch(err => {
				console.error("Error loading devlog:", err);
			});
	</script>

</body>
</html>
