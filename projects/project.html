<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Project — BlueFire Games</title>
    <link href="/style.css" rel="stylesheet" type="text/css">

    <style>
        body {
            background: #050914;
        }

        .project-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #0a1226;
            border-radius: 12px;
            border: 1px solid #1a2a4a;
        }

        /* ⭐ PARALLAX HERO WRAPPER */
        .hero-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            transform-style: preserve-3d;
        }

        .project-hero {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(-1px) scale(1.2);
            transition: transform 0.2s ease-out;
        }

        .hero-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(5, 9, 20, 0) 0%,
                rgba(5, 9, 20, 0.4) 40%,
                rgba(5, 9, 20, 0.75) 70%,
                rgba(5, 9, 20, 1) 100%
            );
            pointer-events: none;
        }

        h1 {
            color: #4fc3ff;
            margin-bottom: 12px;
        }

        p {
            color: #cdd7ff;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .section-title {
            margin-top: 40px;
            margin-bottom: 16px;
            color: #4fc3ff;
            font-size: 1.6rem;
        }

        /* ⭐ TASK SECTION */
        .task-section {
            margin-top: 40px;
            padding: 20px;
            background: #0f1a33;
            border: 1px solid #1a2a4a;
            border-radius: 10px;
        }

        .task-title {
            font-size: 1.4rem;
            color: #6faaff;
            margin-bottom: 16px;
            text-decoration: none;
            display: inline-block;
        }

        .task-title:hover {
            color: #9fc9ff;
        }

        /* ⭐ DEVLOG GRID */
        .devlog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .devlog-card {
            background: #0f1a33;
            border: 1px solid #1a2a4a;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.2s ease;
        }

        .devlog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 14px rgba(79, 195, 255, 0.25);
        }

        .devlog-thumb {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .devlog-info {
            padding: 12px 14px;
        }

        .devlog-info h3 {
            margin: 0 0 6px 0;
            color: #4fc3ff;
            font-size: 1.05rem;
        }

        .devlog-button {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 14px;
            background: #1a3cff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s ease;
            width: fit-content;
        }

        .devlog-button:hover {
            background: #4f6dff;
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 16px;
            background: #1a3cff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-link:hover {
            background: #4f6dff;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<!-- ⭐ GLOBAL LOADER -->
<div id="loading-overlay">
    <div class="loader"></div>
</div>

<div id="nav-placeholder"></div>

<!-- ⭐ WRAP ALL CONTENT FOR FADE-IN -->
<div class="page-content" id="page-content">

<div class="project-container">

    <!-- ⭐ PARALLAX HERO -->
    <div class="hero-wrapper">
        <img id="project-thumb" class="project-hero" src="" alt="">
    </div>

    <h1 id="project-title"></h1>
    <p id="project-description"></p>

    <h2 class="section-title">Tasks</h2>
    <div id="tasks-container"></div>

    <a href="/projects/" class="back-link">← Back to Projects</a>
</div>

</div> <!-- end page-content -->

<script>
fetch("/nav.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("nav-placeholder").innerHTML = html;

        const nav = document.querySelector('.navbar');
        if (!nav) return;

        let lastScroll = 0;

        window.addEventListener('scroll', () => {
            const current = window.scrollY;

            if (current > lastScroll && current > 50) {
                nav.classList.add('hidden');
            } else {
                nav.classList.remove('hidden');
            }

            lastScroll = current;
        });
    });
</script>

<script>
    function hideLoader() {
        document.getElementById("loading-overlay").classList.add("hidden");
        document.getElementById("page-content").classList.add("visible");
    }

    // Safety timeout
    setTimeout(hideLoader, 8000);

    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("id");

    window.addEventListener("scroll", () => {
        const hero = document.querySelector(".project-hero");
        const offset = window.scrollY * 0.25;
        hero.style.transform = `translateY(${offset}px) scale(1.2)`;
    });

    fetch("https://bluefire-notion.jfedders6.workers.dev/projects")
        .then(r => r.json())
        .then(projects => {

            const project = projects.find(p => p.id.replace(/-/g, "") === projectId);

            if (!project) {
                document.getElementById("project-title").textContent = "Project not found";
                hideLoader();
                return;
            }

            document.getElementById("project-title").textContent = project.name;
            document.getElementById("project-description").textContent = project.description;
            document.getElementById("project-thumb").src = project.thumbnail;
            document.getElementById("project-thumb").alt = project.name;

            const tasksContainer = document.getElementById("tasks-container");

            if (!project.tasks || project.tasks.length === 0) {
                tasksContainer.innerHTML = "<p>No tasks yet.</p>";
                hideLoader();
                return;
            }

            project.tasks.forEach(task => {
                const section = document.createElement("div");
                section.className = "task-section";

                section.innerHTML = `
                    <a class="task-title" href="/tasks/task.html?id=${task.id}">
                        ${task.name}
                    </a>
                `;

                const grid = document.createElement("div");
                grid.className = "devlog-grid";

                if (task.devlogs.length === 0) {
                    grid.innerHTML = "<p style='color:#cdd7ff;'>No devlogs yet.</p>";
                } else {
                    task.devlogs.forEach(devlog => {
                        const card = document.createElement("div");
                        card.className = "devlog-card";

                        if (devlog.thumbnail) {
                            const img = document.createElement("img");
                            img.src = devlog.thumbnail;
                            img.alt = devlog.title + " thumbnail";
                            img.className = "devlog-thumb";
                            card.appendChild(img);
                        }

                        const info = document.createElement("div");
                        info.className = "devlog-info";

                        const title = document.createElement("h3");
                        title.textContent = devlog.title;

                        const button = document.createElement("a");
                        button.href = `/devlogs/devlog.html?id=${devlog.id}`;
                        button.className = "devlog-button";
                        button.textContent = "View Devlog";

                        info.appendChild(title);
                        info.appendChild(button);

                        card.appendChild(info);
                        grid.appendChild(card);
                    });
                }

                section.appendChild(grid);
                tasksContainer.appendChild(section);
            });

            hideLoader();
        });
</script>

</body>
</html>
