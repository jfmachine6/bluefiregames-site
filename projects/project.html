<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Project — Bluefire Games</title>
<link href="/style.css" rel="stylesheet" type="text/css">

<style>
body {
    background: #050914;
}

.project-container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background: #0a1226;
    border-radius: 12px;
    border: 1px solid #1a2a4a;
}

h1 {
    color: #4fc3ff;
    margin-bottom: 12px;
}

.task-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.task-card {
    background: #0f1a33;
    border: 1px solid #1a2a4a;
    border-radius: 10px;
    padding: 14px;
    transition: 0.2s ease;
}

.task-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 14px rgba(79, 195, 255, 0.25);
}

.task-card h3 {
    margin: 0 0 6px 0;
    color: #4fc3ff;
}

.task-button {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 14px;
    background: #1a3cff;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: 0.2s ease;
}

.task-button:hover {
    background: #4f6dff;
    transform: translateY(-2px);
}

.back-link {
    display: inline-block;
    margin-top: 30px;
    padding: 10px 16px;
    background: #1a3cff;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: 0.2s ease;
}

.back-link:hover {
    background: #4f6dff;
    transform: translateY(-2px);
}

.hero {
    position: relative;
    height: 260px;
    background-size: cover;
    background-position: center;
    border-bottom: 3px solid #1a2a4a;
}

.hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4), #050914);
}
</style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="hero" id="hero">
    <div class="hero-overlay"></div>
</div>

<div class="project-container">

    <h1 id="project-title"></h1>

    <a href="/projects/index.html" class="back-link">← Back to Projects</a>

    <h2 style="color:#6faaff; margin-top:30px;">Tasks</h2>
    <div id="task-list" class="task-grid"></div>

</div>

<script>
// Load nav
fetch("/nav.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("nav-placeholder").innerHTML = html;
    });

const params = new URLSearchParams(window.location.search);
const projectId = params.get("id");

// ⭐ FIXED: Correct Worker URL
fetch("https://bluefire-notion.jfedders6.workers.dev/")
    .then(r => r.json())
    .then(projects => {
        const project = projects.find(p => p.id.replace(/-/g, "") === projectId);

        if (!project) {
            document.getElementById("project-title").textContent = "Project Not Found";
            return;
        }

        document.getElementById("project-title").textContent = project.name;

        if (project.thumbnail) {
            document.getElementById("hero").style.backgroundImage =
                `url('${project.thumbnail}')`;
        }

        const taskList = document.getElementById("task-list");

        project.tasks.forEach(task => {
            const card = document.createElement("div");
            card.className = "task-card";

            const title = document.createElement("h3");
            title.textContent = task.name;

            const button = document.createElement("a");
            button.href = `/tasks/task.html?id=${task.id}`;
            button.className = "task-button";
            button.textContent = "View Task";

            card.appendChild(title);
            card.appendChild(button);
            taskList.appendChild(card);
        });
    })
    .catch(err => {
        console.error("Error loading project:", err);
    });
</script>

</body>
</html>
