<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Project — Bluefire Games</title>
<link href="/style.css" rel="stylesheet" type="text/css">

<style>
body {
    background: #050914;
}

.hero {
    position: relative;
    height: 260px;
    background-size: cover;
    background-position: center;
    border-bottom: 3px solid #1a2a4a;
}

.hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4), #050914);
}

.project-container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background: #0a1226;
    border-radius: 12px;
    border: 1px solid #1a2a4a;
}

h1 {
    color: #4fc3ff;
    margin-bottom: 10px;
}

.project-description {
    color: #b8c7e0;
    margin-bottom: 30px;
    font-size: 1.1rem;
}

.task-section {
    margin-top: 40px;
}

.task-title {
    color: #6faaff;
    margin-bottom: 12px;
    font-size: 1.4rem;
}

.devlog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
}

.devlog-card {
    background: #0f1a33;
    border: 1px solid #1a2a4a;
    border-radius: 10px;
    padding: 12px;
    transition: 0.2s ease;
}

.devlog-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 14px rgba(79, 195, 255, 0.25);
}

.devlog-thumb {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 10px;
}

.devlog-title {
    color: #4fc3ff;
    font-size: 1.05rem;
    margin-bottom: 6px;
}

.devlog-button {
    display: inline-block;
    padding: 6px 12px;
    background: #1a3cff;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: 0.2s ease;
}

.devlog-button:hover {
    background: #4f6dff;
    transform: translateY(-2px);
}

.back-link {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 16px;
    background: #1a3cff;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: 0.2s ease;
}

.back-link:hover {
    background: #4f6dff;
    transform: translateY(-2px);
}

/* Loader */
.section-loader {
    width: 100%;
    padding: 20px 0;
    text-align: center;
    color: #6faaff;
    font-size: 1.1rem;
    opacity: 0.7;
}
</style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="hero" id="hero">
    <div class="hero-overlay"></div>
</div>

<div class="project-container">

    <h1 id="project-title"></h1>
    <div id="project-description" class="project-description"></div>

    <a href="/projects/index.html" class="back-link">← Back to Projects</a>

    <div id="tasks-container"></div>

</div>

<script>
// Load nav
fetch("/nav.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("nav-placeholder").innerHTML = html;
    });

// Loader helpers
function createLoader() {
    const div = document.createElement("div");
    div.className = "section-loader";
    div.textContent = "Loading...";
    return div;
}

function showLoader(parent) {
    const loader = createLoader();
    parent.appendChild(loader);
    return loader;
}

function hideLoader(loader) {
    loader.remove();
}

const params = new URLSearchParams(window.location.search);
const projectId = params.get("id");

(async () => {
    const tasksContainer = document.getElementById("tasks-container");
    const loader = showLoader(tasksContainer);

    try {
        const res = await fetch("https://bluefire-notion.jfedders6.workers.dev/");
        const projects = await res.json();

        const project = projects.find(p => p.id.replace(/-/g, "") === projectId);
        if (!project) return;

        // Hero banner
        if (project.thumbnail) {
            document.getElementById("hero").style.backgroundImage =
                `url('${project.thumbnail}')`;
        }

        // Title + description
        document.getElementById("project-title").textContent = project.name;
        document.getElementById("project-description").textContent = project.description;

        // Render tasks + devlogs
        project.tasks.forEach(task => {
            const section = document.createElement("div");
            section.className = "task-section";

            const title = document.createElement("div");
            title.className = "task-title";
            title.textContent = task.name;

            const grid = document.createElement("div");
            grid.className = "devlog-grid";

            task.devlogs.forEach(d => {
                const card = document.createElement("div");
                card.className = "devlog-card";

                if (d.thumbnail) {
                    const img = document.createElement("img");
                    img.src = d.thumbnail;
                    img.className = "devlog-thumb";
                    card.appendChild(img);
                }

                const name = document.createElement("div");
                name.className = "devlog-title";
                name.textContent = d.title;
                card.appendChild(name);

                const btn = document.createElement("a");
                btn.href = `/devlogs/devlog.html?id=${d.id}`;
                btn.className = "devlog-button";
                btn.textContent = "View Devlog";
                card.appendChild(btn);

                grid.appendChild(card);
            });

            section.appendChild(title);
            section.appendChild(grid);
            tasksContainer.appendChild(section);
        });

    } catch (err) {
        console.error(err);
    }

    hideLoader(loader);
})();
</script>

</body>
</html>
