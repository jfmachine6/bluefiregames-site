<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — BlueFire Games</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    /* Additional page-specific styling */
    .task-section {
      margin-top: 40px;
      padding: 20px;
      background: #0f1a33;
      border: 1px solid #1a2a4a;
      border-radius: 10px;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .task-title {
      font-size: 1.35rem;
      color: #4fc3ff;
      font-weight: 600;
    }

    .task-link {
      color: #6faaff;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .devlog-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .devlog-card {
      padding: 14px;
      background: #0a1226;
      border: 1px solid #1a2a4a;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s ease;
    }

    .devlog-card:hover {
      border-color: #4fc3ff;
      transform: scale(1.01);
    }

    .devlog-info {
      display: flex;
      flex-direction: column;
    }

    .devlog-title {
      font-size: 1.05rem;
      color: #d8e2f3;
      margin-bottom: 4px;
    }

    .devlog-date {
      font-size: 0.85rem;
      color: #9bb3d6;
    }

    .devlog-thumb {
      width: 90px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #1a2a4a;
      margin-left: 16px;
    }

    .devlog-count {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #7fa4d6;
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<!-- HERO BANNER -->
<div id="hero" class="hero">
  <div class="hero-overlay"></div>
</div>

<!-- MAIN CONTENT -->
<div class="content-container fade-section" id="content">

  <h1 class="content-title" id="project-title"></h1>
  <div class="content-date" id="project-desc"></div>

  <div class="devlog-count" id="project-devlog-count"></div>

  <div id="task-sections"></div>

  <!-- Return to Projects -->
  <div class="project-return-card">
    <a href="/projects/index.html" class="project-return-link">
      <div class="project-return-layout">
        <img id="return-thumb" class="project-return-thumb" />
        <div class="project-return-text">
          <div class="project-return-title">Back to Projects</div>
          <div class="project-return-name" id="return-name"></div>
        </div>
      </div>
    </a>
  </div>

</div>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

async function loadProject() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (!id) return;

  const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

  // Fetch project
  const projectRes = await fetch(`${WORKER}/project?id=${id}`);
  const project = await projectRes.json();

  // Fetch all devlogs (fast list)
  const devlogRes = await fetch(`${WORKER}/devlogs`);
  const allDevlogs = await devlogRes.json();

  // Populate hero
  if (project.thumbnail) {
    document.getElementById("hero").style.backgroundImage =
      `url('${project.thumbnail}')`;
  }

  // Title + description
  document.getElementById("project-title").textContent = project.title;
  document.getElementById("project-desc").textContent = project.description;

  // Return card
  document.getElementById("return-thumb").src =
    project.thumbnail || "/assets/default-thumb.png";
  document.getElementById("return-name").textContent = project.title;

  // Count total devlogs
  const totalDevlogs = project.tasks.reduce(
    (sum, t) => sum + t.sessions.length,
    0
  );
  document.getElementById("project-devlog-count").textContent =
    `${totalDevlogs} Dev Logs`;

  // Build task sections
  const container = document.getElementById("task-sections");

  project.tasks.forEach(task => {
    const section = document.createElement("div");
    section.className = "task-section";

    // Header
    const header = document.createElement("div");
    header.className = "task-header";

    const title = document.createElement("div");
    title.className = "task-title";
    title.textContent = task.title;

    const link = document.createElement("a");
    link.className = "task-link";
    link.href = `/tasks/task.html?id=${task.id}`;
    link.textContent = "View Task";

    header.appendChild(title);
    header.appendChild(link);

    // Devlog list
    const list = document.createElement("div");
    list.className = "devlog-list";

    // Filter devlogs by session IDs
    const sessionIds = task.sessions.map(s => s.id.replace(/-/g, ""));
    const taskDevlogs = allDevlogs.filter(d => sessionIds.includes(d.id));

    taskDevlogs.forEach(d => {
      const card = document.createElement("a");
      card.className = "devlog-card";
      card.href = `/devlog/devlog.html?id=${d.id}`;

      const info = document.createElement("div");
      info.className = "devlog-info";

      const dTitle = document.createElement("div");
      dTitle.className = "devlog-title";
      dTitle.textContent = d.title;

      const dDate = document.createElement("div");
      dDate.className = "devlog-date";
      dDate.textContent = formatDate(d.date);

      info.appendChild(dTitle);
      info.appendChild(dDate);

      const thumb = document.createElement("img");
      thumb.className = "devlog-thumb";
      thumb.src = d.thumbnail || "/assets/default-thumb.png";

      card.appendChild(info);
      card.appendChild(thumb);

      list.appendChild(card);
    });

    section.appendChild(header);
    section.appendChild(list);

    container.appendChild(section);
  });

  // Fade in
  setTimeout(() => {
    document.getElementById("content").classList.add("visible");
  }, 50);
}

loadProject();
</script>

</body>
</html>
