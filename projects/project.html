<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Project — BlueFire Games</title>
    <link href="/style.css" rel="stylesheet" type="text/css">

    <style>
        body {
            background: #050914;
        }

        .project-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #0a1226;
            border-radius: 12px;
            border: 1px solid #1a2a4a;
        }

        /* ⭐ PARALLAX HERO WRAPPER */
        .hero-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            transform-style: preserve-3d;
        }

        .project-hero {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(-1px) scale(1.2);
            transition: transform 0.2s ease-out;
        }

        /* ⭐ GRADIENT OVERLAY */
        .hero-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(5, 9, 20, 0) 0%,
                rgba(5, 9, 20, 0.4) 40%,
                rgba(5, 9, 20, 0.75) 70%,
                rgba(5, 9, 20, 1) 100%
            );
            pointer-events: none;
        }

        h1 {
            color: #4fc3ff;
            margin-bottom: 12px;
        }

        p {
            color: #cdd7ff;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .section-title {
            margin-top: 40px;
            margin-bottom: 16px;
            color: #4fc3ff;
            font-size: 1.6rem;
        }

        /* ⭐ TASK SECTION */
        .task-section {
            margin-top: 30px;
            padding: 18px;
            background: #0f1a33;
            border: 1px solid #1a2a4a;
            border-radius: 10px;
        }

        .task-title {
            font-size: 1.3rem;
            color: #6faaff;
            margin-bottom: 10px;
            text-decoration: none;
            display: inline-block;
        }

        .task-title:hover {
            color: #9fc9ff;
        }

        /* ⭐ DEVLOG LIST UNDER TASK */
        .task-devlog {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        .task-devlog a {
            color: #8fb8ff;
            text-decoration: none;
        }

        .task-devlog a:hover {
            color: #ffffff;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 16px;
            background: #1a3cff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-link:hover {
            background: #4f6dff;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="project-container">

    <!-- ⭐ PARALLAX HERO -->
    <div class="hero-wrapper">
        <img id="project-thumb" class="project-hero" src="" alt="">
    </div>

    <h1 id="project-title"></h1>
    <p id="project-description"></p>

    <h2 class="section-title">Tasks</h2>
    <div id="tasks-container"></div>

    <a href="/projects/" class="back-link">← Back to Projects</a>
</div>

<!-- Load navigation -->
<script>
fetch("/nav.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("nav-placeholder").innerHTML = html;

        const nav = document.querySelector('.navbar');
        if (!nav) return;

        let lastScroll = 0;

        window.addEventListener('scroll', () => {
            const current = window.scrollY;

            if (current > lastScroll && current > 50) {
                nav.classList.add('hidden');
            } else {
                nav.classList.remove('hidden');
            }

            lastScroll = current;
        });
    });
</script>

<script>
    // Parse ?id=XYZ (hyphen-stripped)
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("id");

    // ⭐ PARALLAX SCROLL EFFECT
    window.addEventListener("scroll", () => {
        const hero = document.querySelector(".project-hero");
        const offset = window.scrollY * 0.25;
        hero.style.transform = `translateY(${offset}px) scale(1.2)`;
    });

    // Fetch all projects (now includes nested tasks + devlogs)
    fetch("https://bluefire-notion.jfedders6.workers.dev/projects")
        .then(r => r.json())
        .then(projects => {

            const project = projects.find(p => p.id.replace(/-/g, "") === projectId);

            if (!project) {
                document.getElementById("project-title").textContent = "Project not found";
                return;
            }

            document.getElementById("project-title").textContent = project.name;
            document.getElementById("project-description").textContent = project.description;
            document.getElementById("project-thumb").src = project.thumbnail;
            document.getElementById("project-thumb").alt = project.name;

            const tasksContainer = document.getElementById("tasks-container");

            if (!project.tasks || project.tasks.length === 0) {
                tasksContainer.innerHTML = "<p>No tasks yet.</p>";
                return;
            }

            project.tasks.forEach(task => {
                const section = document.createElement("div");
                section.className = "task-section";

                section.innerHTML = `
                    <a class="task-title" href="/tasks/task.html?id=${task.id}">
                        ${task.name}
                    </a>
                `;

                if (task.devlogs.length === 0) {
                    const empty = document.createElement("p");
                    empty.style.color = "#cdd7ff";
                    empty.style.marginLeft = "20px";
                    empty.textContent = "No devlogs yet.";
                    section.appendChild(empty);
                } else {
                    task.devlogs.forEach(d => {
                        const div = document.createElement("div");
                        div.className = "task-devlog";
                        div.innerHTML = `
                            <a href="/devlogs/devlog.html?id=${d.id}">
                                • ${d.title}
                            </a>
                        `;
                        section.appendChild(div);
                    });
                }

                tasksContainer.appendChild(section);
            });
        });
</script>

</body>
</html>
