<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Projects — Bluefire Games</title>
    <link href="/style.css" rel="stylesheet" type="text/css">
    <style>
.project-card {
    display: flex;
    gap: 20px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #111;
    align-items: center;
}

.project-thumb {
    width: 50%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.project-info {
    flex: 1;
}

.project-info h3 {
    margin: 0 0 8px 0;
    color: #4fc3ff;
}

.project-info p {
    margin: 0;
    color: #ccc;
}

/* Mobile-friendly stacking */
@media (max-width: 700px) {
    .project-card {
        flex-direction: column;
        text-align: center;
    }

    .project-thumb {
        width: 100%;
        max-height: none;
    }

    .project-info {
        text-align: left;
        width: 100%;
    }
}

    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <h1>Projects</h1>
        <p>This page will eventually list game projects, prototypes, and showcases.</p>

        <p>Project List From Notion:</p>

        <div id="project-list"></div>
    </main>

    <!-- Load navigation -->
    <script>
        fetch("/nav.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("nav-placeholder").innerHTML = data;
            });
    </script>

    <!-- Load Notion project list -->

	<script>
	document.addEventListener("DOMContentLoaded", () => {
		fetch("https://bluefire-notion.jfedders6.workers.dev/")
			.then(r => r.json())
			.then(projects => {
				const container = document.getElementById("project-list");

				projects.forEach(project => {
					const card = document.createElement("div");
					card.className = "project-card";

					// Thumbnail
					if (project.thumbnail) {
						const img = document.createElement("img");
						img.src = project.thumbnail;
						img.alt = project.name + " thumbnail";
						img.className = "project-thumb";
						card.appendChild(img);
					}

					// Info container
					const info = document.createElement("div");
					info.className = "project-info";

					const title = document.createElement("h3");
					title.textContent = project.name;

					const desc = document.createElement("p");
					desc.textContent = project.description || "No description provided.";

					info.appendChild(title);
					info.appendChild(desc);

					card.appendChild(info);
					container.appendChild(card);
				});
			})
			.catch(err => {
				console.error("Error loading projects:", err);
			});
	});
	</script>


</body>
</html>
