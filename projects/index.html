<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — BlueFire Games</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    body {
      background: #050914;
      color: #d8e2f3;
    }

    .page-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .page-title {
      color: #4fc3ff;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 30px;
    }

    .project-card {
      background: #0a1226;
      border: 1px solid #1a2a4a;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.25s ease;
    }

    .project-card:hover {
      transform: scale(1.02);
      border-color: #4fc3ff;
      box-shadow: 0 0 12px rgba(79, 195, 255, 0.35);
    }

    .project-thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #0f1a33;
      cursor: pointer;
    }

    .project-info {
      padding: 14px 16px;
    }

    .project-title {
      font-size: 1.15rem;
      color: #4fc3ff;
      margin: 0 0 6px 0;
    }

    .project-desc {
      font-size: 0.9rem;
      color: #9bb3d6;
      margin-bottom: 10px;
    }

    .project-devlog-count {
      font-size: 0.85rem;
      color: #9bb3d6;
      margin-bottom: 12px;
    }

    .project-btn {
      width: 100%;
      padding: 10px;
      background: #4fc3ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .project-btn:hover {
      background: #7fd9ff;
    }

    .loader {
      margin: 40px auto;
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="page-container">

  <h1 class="page-title">Projects</h1>

  <div id="project-grid" class="project-grid"></div>

  <div id="loader" class="section-loader">
    <div class="loader"></div>
  </div>

</div>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

async function loadProjects() {
  const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

  const res = await fetch(`${WORKER}/projects`, {
    method: "GET",
    mode: "cors",
    cache: "no-store"
  });

  const projects = await res.json();
  document.getElementById("loader").style.display = "none";

  const grid = document.getElementById("project-grid");

  projects.forEach(project => {
    const card = document.createElement("div");
    card.className = "project-card";

    // Thumbnail
    const img = document.createElement("img");
    img.className = "project-thumb";
    img.src = project.thumbnail || "/assets/default-thumb.png";
    img.onclick = () => {
      window.location.href = `/projects/project.html?id=${project.id}`;
    };

    // Info container
    const info = document.createElement("div");
    info.className = "project-info";

    // Title
    const title = document.createElement("div");
    title.className = "project-title";
    title.textContent = project.title;

    // Description
    const desc = document.createElement("div");
    desc.className = "project-desc";
    desc.textContent = project.description;

    // Devlog count (from rollup)
    const count = document.createElement("div");
    count.className = "project-devlog-count";
    count.textContent = `${project.devlogCount} devlogs`;

    // Button
    const btn = document.createElement("button");
    btn.className = "project-btn";
    btn.textContent = "View Project";
    btn.onclick = () => {
      window.location.href = `/projects/project.html?id=${project.id}`;
    };

    info.appendChild(title);
    info.appendChild(desc);
    info.appendChild(count);
    info.appendChild(btn);

    card.appendChild(img);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

loadProjects();
</script>

</body>
</html>
