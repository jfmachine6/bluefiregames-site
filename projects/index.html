<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Projects — Bluefire Games</title>
    <link href="/style.css" rel="stylesheet" type="text/css">

    <style>
        body {
            background: #050914;
            color: #cdd7ff;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #4fc3ff;
            margin-bottom: 10px;
        }

        p {
            color: #cdd7ff;
            line-height: 1.5;
        }

        /* GRID LAYOUT */
        #project-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 28px;
            margin-top: 32px;
        }

        /* CARD */
        .project-card {
            display: flex;
            flex-direction: column;
            background: #0a1226;
            border: 1px solid #1a2a4a;
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 18px rgba(79, 195, 255, 0.25);
        }

        /* THUMBNAIL */
        .project-thumb {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-bottom: 1px solid #1a2a4a;
        }

        /* INFO */
        .project-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
        }

        .project-info h3 {
            margin: 0 0 10px 0;
            color: #4fc3ff;
            font-size: 1.3rem;
        }

        .project-info p {
            margin: 0;
            color: #cdd7ff;
            line-height: 1.4;
        }

        /* BUTTON */
        .project-button {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 18px;
            background: #1a3cff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s ease;
            width: fit-content;
        }

        .project-button:hover {
            background: #4f6dff;
            transform: translateY(-2px);
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .project-thumb {
                height: 200px;
            }
        }
    </style>
</head>

<body>

<div id="nav-placeholder"></div>

<main>
    <h1>Projects</h1>
    <p>This page will eventually list game projects, prototypes, and showcases.</p>

    <p>Project List From Notion:</p>

    <!-- ⭐ SECTION LOADER -->
    <div id="project-loading" class="section-loader">
        <div class="loader"></div>
    </div>

    <!-- ⭐ FADES IN WHEN LOADED -->
    <div id="project-list" class="fade-section"></div>
</main>

<!-- Load navigation -->
<script>
fetch("/nav.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("nav-placeholder").innerHTML = html;

        const nav = document.querySelector('.navbar');
        if (!nav) return;

        let lastScroll = 0;

        window.addEventListener('scroll', () => {
            const current = window.scrollY;

            if (current > lastScroll && current > 50) {
                nav.classList.add('hidden');
            } else {
                nav.classList.remove('hidden');
            }

            lastScroll = current;
        });
    });
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // ⭐ UPDATED: Fetch from your new Worker
    fetch("/projects")
        .then(r => r.json())
        .then(projects => {
            const container = document.getElementById("project-list");

            projects.forEach(project => {
                const card = document.createElement("div");
                card.className = "project-card";

                // Thumbnail
                if (project.thumbnail) {
                    const img = document.createElement("img");
                    img.src = project.thumbnail;
                    img.alt = project.title + " thumbnail";
                    img.className = "project-thumb";
                    card.appendChild(img);
                }

                // Info container
                const info = document.createElement("div");
                info.className = "project-info";

                const title = document.createElement("h3");
                title.textContent = project.title;

                const desc = document.createElement("p");
                desc.textContent = project.description || "No description provided.";

                // ⭐ UPDATED: ID is already normalized by Worker
                const button = document.createElement("a");
                button.href = `/projects/project.html?id=${project.id}`;
                button.className = "project-button";
                button.textContent = "View Project";

                info.appendChild(title);
                info.appendChild(desc);
                info.appendChild(button);

                card.appendChild(info);
                container.appendChild(card);
            });

            // Hide loader, fade in content
            document.getElementById("project-loading").style.display = "none";
            container.classList.add("visible");
        })
        .catch(err => {
            console.error("Error loading projects:", err);
            document.getElementById("project-loading").style.display = "none";
        });
});
</script>

</body>
</html>
