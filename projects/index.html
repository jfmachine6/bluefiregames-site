<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Projects — Bluefire Games</title>
    <link href="/style.css" rel="stylesheet" type="text/css">
    <style>
		.project-card {
			display: flex;
			gap: 20px;
			padding: 20px;
			margin-bottom: 24px;
			border: 1px solid #1a2a4a;
			border-radius: 12px;
			background: #0a1226; /* deep blue */
			align-items: center;
			min-height: 260px; /* makes cards taller / more square */
		}

		.project-thumb {
			width: 75%; /* image takes majority of the card */
			height: 100%; /* fills the card height */
			max-height: 260px; /* controls vertical size */
			object-fit: cover; /* crops nicely */
			border-radius: 10px;
			flex-shrink: 0;
		}

		.project-info {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: center; /* vertically centers text */
		}

		.project-info h3 {
			margin: 0 0 10px 0;
			color: #4fc3ff;
			font-size: 1.4rem;
		}

		.project-info p {
			margin: 0;
			color: #cdd7ff;
			line-height: 1.4;
		}

		/* Mobile layout */
		@media (max-width: 700px) {
			.project-card {
				flex-direction: column;
				text-align: center;
				min-height: auto;
			}

			.project-thumb {
				width: 100%;
				height: auto;
				max-height: none;
			}

			.project-info {
				width: 100%;
				text-align: left;
			}
		}


    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <h1>Projects</h1>
        <p>This page will eventually list game projects, prototypes, and showcases.</p>

        <p>Project List From Notion:</p>

        <div id="project-list"></div>
    </main>

    <!-- Load navigation -->
    <script>
        fetch("/nav.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("nav-placeholder").innerHTML = data;
            });
    </script>

    <!-- Load Notion project list -->

	<script>
	document.addEventListener("DOMContentLoaded", () => {
		fetch("https://bluefire-notion.jfedders6.workers.dev/")
			.then(r => r.json())
			.then(projects => {
				const container = document.getElementById("project-list");

				projects.forEach(project => {
					const card = document.createElement("div");
					card.className = "project-card";

					// Thumbnail
					if (project.thumbnail) {
						const img = document.createElement("img");
						img.src = project.thumbnail;
						img.alt = project.name + " thumbnail";
						img.className = "project-thumb";
						card.appendChild(img);
					}

					// Info container
					const info = document.createElement("div");
					info.className = "project-info";

					const title = document.createElement("h3");
					title.textContent = project.name;

					const desc = document.createElement("p");
					desc.textContent = project.description || "No description provided.";

					info.appendChild(title);
					info.appendChild(desc);

					card.appendChild(info);
					container.appendChild(card);
				});
			})
			.catch(err => {
				console.error("Error loading projects:", err);
			});
	});
	</script>


</body>
</html>
