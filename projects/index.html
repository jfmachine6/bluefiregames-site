<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>

  <!-- Global site styling -->
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- Nav injected by loader.js -->
  <nav id="navbar"></nav>

  <main>

    <!-- HERO BANNER -->
    <section class="hero" style="background-image: url('/assets/hero-projects.jpg');">
      <div class="hero-overlay"></div>
    </section>

    <!-- PAGE CONTENT -->
    <div class="content-container fade-section" id="projects-section">

      <h1 class="content-title">Projects</h1>
      <p class="content-date">All active and archived Bluefire projects</p>

      <div id="projects-list"></div>

    </div>

  </main>

  <script>
    // Utility to create elements
    function el(tag, cls) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      return e;
    }

    // Load all projects
    async function loadProjects() {
      const container = document.getElementById("projects-list");

      // Show loader
      container.innerHTML = `
        <div class="section-loader">
          <div class="loader"></div>
        </div>
      `;

      const res = await fetch("/projects");
      const projects = await res.json();

      container.innerHTML = ""; // clear loader

      projects.forEach(project => {
        const card = el("div", "project-return-card");

        const link = el("a", "project-return-link");
        link.href = `/projects/project.html?id=${project.id}`;

        const layout = el("div", "project-return-layout");

        // Thumbnail
        const img = el("img", "project-return-thumb");
        img.src = project.thumbnail || "/assets/default-thumb.png";

        // Text
        const textWrap = el("div", "project-return-text");

        const title = el("div", "project-return-title");
        title.textContent = project.title;

        const name = el("div", "project-return-name");
        name.textContent = project.description || "No description available";

        textWrap.appendChild(title);
        textWrap.appendChild(name);

        layout.appendChild(img);
        layout.appendChild(textWrap);
        link.appendChild(layout);
        card.appendChild(link);

        container.appendChild(card);
      });

      // Fade in
      document.getElementById("projects-section").classList.add("visible");
    }

    loadProjects();
  </script>

  <!-- Load nav + global loader behavior -->
  <script src="/assets/components/loader.js" defer></script>

</body>
</html>
