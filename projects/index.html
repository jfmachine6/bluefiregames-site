<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueFire Games | Projects</title>

  <link rel="stylesheet" href="/style.css" />

  <style>
    body {
      background: #050914;
      color: #d8e2f3;
    }

    .page-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    .page-title {
      color: #4fc3ff;
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    /* Bigger cards */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 28px;
      margin-top: 30px;
    }

    .project-card {
      background: #0a1226;
      border: 1px solid #1a2a4a;
      border-radius: 14px;
      overflow: hidden;
      transition: 0.25s ease;

      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      transform: scale(1.02);
      border-color: #4fc3ff;
      box-shadow: 0 0 14px rgba(79, 195, 255, 0.35);
    }

    .project-thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #0f1a33;
      cursor: pointer;
    }

    .project-info {
      padding: 18px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .project-title {
      font-size: 1.35rem;
      color: #4fc3ff;
      margin: 0 0 10px 0;
    }

    .project-desc {
      font-size: 1rem;
      color: #9bb3d6;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Footer bar at bottom */
    .project-footer {
      margin-top: auto;
      padding: 14px 20px;
      border-top: 1px solid #1a2a4a;
      background: #0d162f;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .project-meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #7fa4d6;
    }

    .project-btn {
      width: 100%;
      padding: 12px;
      background: #4fc3ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .project-btn:hover {
      background: #7fd9ff;
    }

    .loader {
      margin: 40px auto;
    }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="page-container">

  <h1 class="page-title">Projects</h1>

  <div id="project-grid" class="project-grid"></div>

  <div id="loader" class="section-loader">
    <div class="loader"></div>
  </div>

</div>

<script>
// Load navigation
fetch("/nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav-placeholder").innerHTML = html;
  });

function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

async function loadProjects() {
  const WORKER = "https://bluefire-notion.jfedders6.workers.dev";

  const res = await fetch(`${WORKER}/projects`, {
    method: "GET",
    mode: "cors",
    cache: "no-store"
  });

  const projects = await res.json();
  document.getElementById("loader").style.display = "none";

  const grid = document.getElementById("project-grid");

  projects.forEach(project => {
    const card = document.createElement("div");
    card.className = "project-card";

    // Thumbnail
    const img = document.createElement("img");
    img.className = "project-thumb";
    img.src = project.thumbnail || "/assets/default-thumb.png";
    img.onclick = () => {
      window.location.href = `/projects/project.html?id=${project.id}`;
    };

    // Info container
    const info = document.createElement("div");
    info.className = "project-info";

    // Title
    const title = document.createElement("div");
    title.className = "project-title";
    title.textContent = project.title;

    // Description
    const desc = document.createElement("div");
    desc.className = "project-desc";
    desc.textContent = project.description;

    // Footer
    const footer = document.createElement("div");
    footer.className = "project-footer";

    // Meta row
    const metaRow = document.createElement("div");
    metaRow.className = "project-meta-row";

    const dateText = document.createElement("div");
    dateText.textContent = formatDate(project.lastEdited || project.createdTime);

    const countText = document.createElement("div");
    countText.textContent = `${project.sessionCount} Dev Logs`;

    metaRow.appendChild(dateText);
    metaRow.appendChild(countText);

    // Button
    const btn = document.createElement("button");
    btn.className = "project-btn";
    btn.textContent = "View Project";
    btn.onclick = () => {
      window.location.href = `/projects/project.html?id=${project.id}`;
    };

    footer.appendChild(metaRow);
    footer.appendChild(btn);

    info.appendChild(title);
    info.appendChild(desc);

    card.appendChild(img);
    card.appendChild(info);
    card.appendChild(footer);

    grid.appendChild(card);
  });
}

loadProjects();
</script>

</body>
</html>
